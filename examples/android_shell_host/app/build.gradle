plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'dev.crosswake.shell'
  compileSdk 35

  defaultConfig {
    applicationId "dev.crosswake.shell"
    minSdk 30
    targetSdk 35
    versionCode 1
    versionName "0.2.1" // x-release-please-version
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  flavorDimensions "env"

  productFlavors {
    prod {
      dimension "env"
    }
    dev {
      dimension "env"
      applicationIdSuffix ".dev"
      versionNameSuffix "-dev"
    }
  }

  buildFeatures {
    compose true
  }

  composeOptions {
    kotlinCompilerExtensionVersion = "1.5.14"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  testOptions {
    animationsDisabled = true

    unitTests {
      includeAndroidResources = true
    }

    managedDevices {
      devices {
        crosswakeApi34(com.android.build.api.dsl.ManagedVirtualDevice) {
          device = "Pixel 6"
          apiLevel = 34
          systemImageSource = "aosp-atd"
        }
      }
    }
  }
}

dependencies {
  implementation 'io.github.sztheory:crosswake-shell-core-android:0.2.1' // x-release-please-version
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.activity:activity-compose:1.9.0'
  implementation platform('androidx.compose:compose-bom:2024.06.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-graphics'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.activity:activity-ktx:1.9.0'
  implementation 'androidx.fragment:fragment-ktx:1.8.2'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
  implementation 'androidx.webkit:webkit:1.15.0'
  implementation 'androidx.camera:camera-core:1.4.2'
  implementation 'androidx.camera:camera-camera2:1.4.2'
  implementation 'androidx.camera:camera-lifecycle:1.4.2'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
  testImplementation 'org.robolectric:robolectric:4.13'

  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test:core-ktx:1.6.1'
  androidTestImplementation 'androidx.test:runner:1.6.1'
}
