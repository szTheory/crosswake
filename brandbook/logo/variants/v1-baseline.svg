<?xml version="1.0" encoding="UTF-8"?>
<!-- V1 Baseline: Mark A exact as-picked control (D-01/D-06) -->
<!-- Axis: none — this is the locked winner geometry, control variant -->
<!-- Provenance: hand-authored on 64-unit grid, 20-deg canonical angle (AUDIT §8) -->
<!-- Geometry: stroke-width=6.667u, notch=10u (1.5x stroke), round caps -->
<!-- Route: (0,43.65)→(64,20.35), notch center (32,32) -->
<!-- D-01: locked winner — route segs, wake lines, stroke, notch unchanged -->
<!-- D-04: path/line-only, no text, no rect, no bounding shape -->
<!-- D-06: baseline — every other variant differs from this on exactly one axis -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g id="mark-a" fill="none" stroke="currentColor"
     stroke-width="6.667" stroke-linecap="round">
    <!-- Route segment 1: (0,43.65) → notch break start (27.30,33.71) -->
    <line x1="0" y1="43.65" x2="27.30" y2="33.71" />
    <!-- Route segment 2: notch break end (36.70,30.29) → (64,20.35) -->
    <line x1="36.70" y1="30.29" x2="64" y2="20.35" />
    <!-- Wake line 1: center (36.56,44.53), 32u span at 20-deg -->
    <line x1="20.59" y1="50.34" x2="52.53" y2="38.71" />
    <!-- Wake line 2: center (41.12,57.06), 32u span at 20-deg -->
    <line x1="25.15" y1="62.87" x2="57.10" y2="51.24" />
  </g>
</svg>
