<?xml version="1.0" encoding="UTF-8"?>
<!-- V3 Stroke: heavier stroke-weight axis variant (D-01/D-06) -->
<!-- Axis: STROKE WEIGHT — stroke-width increases from 6.667u to 7.20u -->
<!-- All other geometry byte-identical to v1-baseline: same route coords, same wake lines, same notch -->
<!-- D-04: path/line-only, no text, no rect -->
<!-- D-06: one axis only — stroke-width heavier; all coordinates unchanged -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g id="mark-a" fill="none" stroke="currentColor"
     stroke-width="7.20" stroke-linecap="round">
    <!-- Route segment 1: (0,43.65) → notch break start (27.30,33.71) — unchanged -->
    <line x1="0" y1="43.65" x2="27.30" y2="33.71" />
    <!-- Route segment 2: notch break end (36.70,30.29) → (64,20.35) — unchanged -->
    <line x1="36.70" y1="30.29" x2="64" y2="20.35" />
    <!-- Wake line 1: center (36.56,44.53), 32u span at 20-deg — unchanged -->
    <line x1="20.59" y1="50.34" x2="52.53" y2="38.71" />
    <!-- Wake line 2: center (41.12,57.06), 32u span at 20-deg — unchanged -->
    <line x1="25.15" y1="62.87" x2="57.10" y2="51.24" />
  </g>
</svg>
