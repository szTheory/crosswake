<!-- T2-A Seam-Step Wordmark — wordmark-seamstep.svg -->
<!-- Concept: stock letterforms + single horizontal route line that steps down 5u -->
<!--   at the cross|wake word boundary (x=188, between second s and w) -->
<!-- Stock letterforms: Space Grotesk SemiBold 600, 72px, pinned commit 877f891 -->
<!-- Route geometry: -->
<!--   Segment 1: x=3.74 to x=188, y=80 (8u below baseline of 72) -->
<!--   Step connector: x=188, y=80 to y=85 (5u perpendicular step, hard 90-deg join) -->
<!--   Segment 2: x=188 to x=366.40, y=85 -->
<!--   Stroke-width: 4.5u; stroke-linecap: round; stroke-linejoin: miter -->
<!-- D-11: non-reproducible by typing in stock Space Grotesk -->
<!--   The route underline is integrated composition, not a typeable glyph -->
<!-- D-04: path-only SVG, no text/rect/font, currentColor -->
<!-- Lockup pairing: T2-A pairs with mark A only (A+T2-A = mark clean + wordmark carries seam) -->
<!--   Do not pair with mark B (double seam-step = redundant) -->
