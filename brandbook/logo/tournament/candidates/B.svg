<?xml version="1.0" encoding="UTF-8"?>
<!-- Candidate B: Seam Shift -->
<!-- Provenance: hand-authored on 64-unit grid, 20-deg route with perpendicular seam offset -->
<!-- Concept: the seam boundary at x=32 visibly shifts the route perpendicular (6u) -->
<!--   but does NOT break it — route continues at the same 20deg slope after the shift -->
<!-- Geometry: stroke-width=6.667, seam-step=6u perpendicular, round caps -->
<!-- D-03: 20deg angle preserved (both segments), round caps, strokes-as-strokes -->
<!-- D-04: path-only, no text elements, no rect, no bounding shape -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g id="mark-b" fill="none" stroke="currentColor"
     stroke-width="6.667" stroke-linecap="round">
    <!-- Route segment 1 (pre-seam): (0,43.65) to seam entry (32,32) — 20deg slope -->
    <line x1="0" y1="43.65" x2="32" y2="32" />
    <!-- Seam connector: perpendicular step from (32,32) to (34.05,37.64) -->
    <line x1="32" y1="32" x2="34.05" y2="37.64" />
    <!-- Route segment 2 (post-seam): (34.05,37.64) to (64,26.74) — same 20deg slope -->
    <line x1="34.05" y1="37.64" x2="64" y2="26.74" />
    <!-- Wake line 1: trailing from shifted-route area, same slope, center (36.56,44.53) -->
    <line x1="25.28" y1="48.63" x2="47.84" y2="40.42" />
    <!-- Wake line 2: outer trailing, same slope, center (38.84,50.80) -->
    <line x1="27.56" y1="54.90" x2="50.12" y2="46.69" />
  </g>
</svg>
