<!-- Candidate B2: Seam Shift — Recalibrated -->
<!-- Provenance: B.svg recalibrated per round-2 research spec -->
<!-- Change: seam step reduced from 5.64u to 3.76u perpendicular displacement -->
<!--   Old connector: (32,32) to (34.05,37.64); New: (32,32) to (33.37,35.76) -->
<!--   Perpendicular unit vector: (sin20=0.3420, cos20=0.9397) -->
<!--   New step = 4u * perp = 4*(0.3420,0.9397) = (1.368,3.759) → (33.37,35.76) checked -->
<!--   Route seg 2 start updated: (34.05,37.64) -> (33.37,35.76) -->
