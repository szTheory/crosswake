name: Setup Android JVM toolchain
description: Configure JDK 17 and the wrapper-derived Gradle version with official caching and validation.

inputs:
  working-directory:
    description: Directory containing gradle/wrapper/gradle-wrapper.properties.
    required: true
  java-version:
    description: Temurin JDK version used by Android JVM proof.
    default: "17"
  gradle-version:
    description: Optional exact Gradle version; defaults to the version declared by the wrapper.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - id: wrapper
      name: Resolve Gradle wrapper version
      shell: bash
      run: |
        set -euo pipefail
        wrapper="${{ inputs.working-directory }}/gradle/wrapper/gradle-wrapper.properties"
        test -f "$wrapper"
        version="${{ inputs.gradle-version }}"
        if [ -z "$version" ]; then
          distribution_url="$(sed -n 's/^distributionUrl=//p' "$wrapper")"
          version="$(printf '%s\n' "$distribution_url" | sed -E 's#.*gradle-([0-9][0-9.]*)-(bin|all)\.zip#\1#')"
        fi
        if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
          echo "::error::Could not derive an exact Gradle version from $wrapper"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - id: compatibility
      name: Resolve Gradle configuration identity
      shell: bash
      run: |
        set -euo pipefail
        root="${{ inputs.working-directory }}"
        config_hash="$(
          find "$root" -type f \( \
            -name '*.gradle' -o -name '*.gradle.kts' -o \
            -name 'gradle-wrapper.properties' -o -name 'gradle.lockfile' -o \
            -name '*.versions.toml' -o -name 'versions.properties' \
          \) -print0 |
            LC_ALL=C sort -z |
            xargs -0 shasum -a 256 |
            shasum -a 256 |
            awk '{print $1}'
        )"
        echo "digest=$config_hash" >> "$GITHUB_OUTPUT"

    - name: Set up Gradle and validate wrappers
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        gradle-version: ${{ steps.wrapper.outputs.version }}
        workflow-job-context: ${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}-jdk${{ inputs.java-version }}-gradle${{ steps.wrapper.outputs.version }}-${{ steps.compatibility.outputs.digest }}
