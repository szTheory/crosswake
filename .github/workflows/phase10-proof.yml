name: Phase 10 Proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase10-proof:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Verify SaaS profile
        run: bash script/verify_saas_profile.sh

      - name: Verify Selective Native profile
        run: bash script/verify_selective_native.sh

      - name: Verify Local-First profile
        run: bash script/verify_local_first.sh
