name: Phase 10 Proof

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase10-proof:
    # ubuntu-latest: all three verify_*.sh are 10-line wrappers around `mix run` +
    # `mix test` against examples/phoenix_host. No Apple toolchain, no macOS host
    # assumptions (no uname/brew/Xcode paths) — audited per-script, Phase 153.1 RUNNER-01.
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Verify SaaS profile
        run: bash script/verify_saas_profile.sh

      - name: Verify Selective Native profile
        run: bash script/verify_selective_native.sh

      - name: Verify Local-First profile
        run: bash script/verify_local_first.sh
