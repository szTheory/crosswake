name: Phase 34 Commerce Advisory

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: phase34-commerce-advisory-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  advisory-commerce-proof:
    name: advisory phase34 commerce proof (provider/storefront/simulator/device)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Report the intentionally unshipped provider proof boundary
        run: |
          echo 'advisory — no provider adapters shipped'
          echo 'StoreKit, Play Billing, device, and storefront proof remains outside current scope.'
      - name: Advisory lane status summary
        run: |
          echo '::notice title=Advisory lane::This scheduled/manual lane is advisory only and cannot gate merge.'
          echo '::notice::Promotion requires an explicit requirement and roadmap change plus sustained evidence.'
