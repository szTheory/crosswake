name: Phase 132 Proof

# Phase 132 generalizes the companion extraction recipe to a SECOND companion
# (rindle) and adds the COMPAT compatibility-matrix drift lane. Proof lanes mirror
# phase130-proof.yml:
#
#   - core-hermetic-proof: hermetic, deterministic, runs on every PR and push to
#     main. Covers EXTRACT-03 (no static alias to an extracted companion in lib/ —
#     the CompanionGuard MapSet now includes Crosswake.Companions.Rindle), the
#     COMPAT-03 compat-matrix drift test, and the broad hermetic core suite
#     (excludes requires_example_host + advisory_only). Merge-blocking. No companion
#     Hex dep in this job.
#
#   - companion-engine-absent-proof: runs `mix companions.test` (rulestead + rindle
#     lanes) plus the parameterized verify_companion_package.sh dress-rehearsal for
#     crosswake_rindle. Merge-blocking. The rindle lane runs the moved phase45/phase72
#     adapter + domain proofs with each lane's default tag exclusions applied.
#
#   - companion-engine-present-proof: advisory-only lane. Runs the rindle package's
#     :engine_present-tagged advisory test with ENGINE_PRESENT_LANE=1 and a `mix clean`
#     first so a stale engine-absent .beam cannot leak into the lane (D-33). Cannot
#     gate merges.
#
# The standalone phase72-proof.yml is retired in this phase: the Phase 72
# media/evidence workflow proof moved into packages/crosswake_rindle/ and now runs
# inside the companion-engine-absent-proof job below (ubuntu-latest, no macOS).
#
# Registration (run out-of-band by maintainer after this workflow goes green on main):
#   Add "core-hermetic-proof" and "companion-engine-absent-proof" as required checks
#   on the main branch.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run the advisory engine-present lane weekly (Monday 08:00 UTC) so absence of
    # advisory results is visible in the CI dashboard between PRs.
    - cron: "0 8 * * 1"

jobs:
  core-hermetic-proof:
    # Required branch check. Runs on every PR and push to main. Hermetic — no
    # companion Hex dep. Covers:
    #   - phase130_extraction_guards_test.exs (EXTRACT-03 guard, now incl. Rindle)
    #   - phase132_compat_matrix_drift_test.exs (COMPAT-03, added in 132-02)
    #   - the broad hermetic suite (excludes requires_example_host / advisory_only).
    #
    # Intentionally skipped on the weekly `schedule` trigger (advisory lane only).
    name: core hermetic proof (merge-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run extraction guard proof (EXTRACT-03 — CompanionGuard MapSet incl. Rindle)
        run: mix test test/crosswake/proof/phase130_extraction_guards_test.exs

      - name: Run compat-matrix drift proof (COMPAT-03)
        # The drift test is created in 132-02. Skip gracefully if not yet present so
        # this workflow can land in 132-03 ahead of the 132-02 merge.
        run: |
          if [ -f test/crosswake/proof/phase132_compat_matrix_drift_test.exs ]; then
            mix test test/crosswake/proof/phase132_compat_matrix_drift_test.exs
          else
            echo "::notice title=COMPAT-03::phase132_compat_matrix_drift_test.exs not present yet (lands in 132-02) — skipping."
          fi

      - name: Run broad hermetic suite (excludes requires_example_host + advisory_only)
        run: mix test --exclude requires_example_host --exclude advisory_only

  companion-engine-absent-proof:
    # Required branch check. Runs the rindle (and rulestead) companion lanes plus the
    # parameterized verify script for crosswake_rindle. Merge-blocking.
    #
    # Intentionally skipped on the weekly `schedule` trigger (advisory lane only).
    name: companion engine-absent proof (merge-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Install Elixir dependencies (rindle companion)
        working-directory: packages/crosswake_rindle
        run: mix deps.get

      - name: Compile rindle companion (warnings as errors)
        working-directory: packages/crosswake_rindle
        run: mix compile --warnings-as-errors

      - name: Run companion lanes (rulestead + rindle)
        # mix companions.test chains both lanes. Default tag exclusions from each
        # test_helper.exs apply — :engine_present and :requires_example_host tests are
        # excluded automatically (the hermetic, merge-blocking default lane).
        run: mix companions.test

      - name: Run verify_companion_package.sh for crosswake_rindle (EXTRACT-02 dress-rehearsal)
        # Confirms: test/ excluded from files: allowlist, lib/ source present
        # (parameterized rindle.ex check), compile --warnings-as-errors clean.
        run: CROSSWAKE_RELEASE=1 bash script/verify_companion_package.sh crosswake_rindle

  companion-engine-present-proof:
    # Advisory lane. Runs on schedule (weekly) and on workflow_dispatch only.
    # Does NOT run on pull_request or push to main — cannot gate merges even if every
    # step fails.
    #
    # ENGINE_PRESENT_LANE=1 appends test/engine_present/rindle.ex (the fake top-level
    # Rindle stub) to elixirc_paths(:test). The mix clean step BEFORE this lane
    # prevents stale .beam files from leaking into the engine-absent lane (D-33).
    name: companion engine-present proof (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # continue-on-error ensures advisory failures are visible in CI dashboard but do
    # NOT block merges (D-33).
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Install Elixir dependencies (rindle companion)
        working-directory: packages/crosswake_rindle
        run: mix deps.get

      - name: mix clean — purge stale engine-absent .beam before engine-present build (D-33)
        working-directory: packages/crosswake_rindle
        run: mix clean

      - name: Run engine-present advisory tests (validate_dependency :ok)
        # Runs only the :engine_present-tagged tests. The fake Rindle stub in
        # test/engine_present/ is compiled into elixirc_paths(:test) when
        # ENGINE_PRESENT_LANE=1.
        working-directory: packages/crosswake_rindle
        run: mix test --only engine_present
        env:
          ENGINE_PRESENT_LANE: "1"

      - name: Advisory lane status summary
        run: |
          echo "::notice title=Advisory lane::This lane is advisory only and"
          echo "::notice::cannot gate merge. Failures here do NOT retract any"
          echo "::notice::merge-blocking Phase 132 extraction claim."
