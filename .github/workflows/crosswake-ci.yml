  ios-package-unit:
    name: ios-package-unit
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: swift-cache-identity
        name: Resolve Swift and Xcode cache identity
        working-directory: packages/crosswake-shell-core-ios
        run: |
          set -euo pipefail
          toolchain="$( { swift --version; xcodebuild -version; } | shasum -a 256 | awk '{print $1}')"
          resolved_state="absent"
          if [ -f Package.resolved ]; then
            resolved_state="present-$(shasum -a 256 Package.resolved | awk '{print $1}')"
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          echo "resolved-state=$resolved_state" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: packages/crosswake-shell-core-ios/.build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-cache-identity.outputs.toolchain }}-${{ hashFiles('packages/crosswake-shell-core-ios/Package.swift') }}-${{ steps.swift-cache-identity.outputs.resolved-state }}
