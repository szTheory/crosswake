    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Elixir dependencies
        run: mix deps.get
      - name: Verify SaaS profile
        run: bash script/verify_saas_profile.sh
      - name: Verify selective-native profile
        run: bash script/verify_selective_native.sh
      - name: Verify local-first profile
        run: bash script/verify_local_first.sh
      - name: Summarize Phase 10 proof
        if: always()
        run: |
