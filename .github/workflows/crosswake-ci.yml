name: Crosswake CI

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: crosswake-ci-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  classify-change:
    name: classify-change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      schema_version: ${{ steps.classify.outputs.schema_version }}
      classification: ${{ steps.classify.outputs.classification }}
      reason: ${{ steps.classify.outputs.reason }}
      scheduled_families: ${{ steps.classify.outputs.scheduled_families }}
      irrelevant_leaves: ${{ steps.classify.outputs.irrelevant_leaves }}
    steps:
      - name: Check out the synthetic merge with full history
        id: checkout
        continue-on-error: true
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify the validated base-to-merge diff
        id: classify
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          set -euo pipefail
          {
            echo 'schema_version=1'
            echo 'classification=full_proof'
            echo 'reason=checkout_or_object_validation_failed'
            echo 'scheduled_families=["full_proof"]'
            echo 'irrelevant_leaves=[]'
          } >> "$GITHUB_OUTPUT"

          if [ "$CHECKOUT_OUTCOME" != 'success' ]; then
            echo 'Crosswake CI could not acquire full history. Running the full proof set.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha="$BASE_SHA"
          merge_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          if [ -z "$base_sha" ] || [ -z "$merge_sha" ] || \
             ! git cat-file -e "$base_sha^{commit}" 2>/dev/null || \
             ! git cat-file -e "$merge_sha^{commit}" 2>/dev/null; then
            echo 'Crosswake CI could not validate the comparison base. Running the full proof set.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 script/classify_ci_change.py \
            --base "$base_sha" \
            --merge "$merge_sha" \
            --github-output "$GITHUB_OUTPUT" >/dev/null

  documentation-contracts:
    name: documentation-contracts
    needs: [classify-change]
    if: needs.classify-change.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Run first-adopter privacy and documentation contracts
        run: |
          mix crosswake.adoption_context.scan
          mix test test/crosswake/guides test/crosswake/proof/phase69_docs_contract_parity_test.exs
      - name: Summarize the documentation contract leaf
        env:
          CLASSIFICATION: ${{ needs.classify-change.outputs.classification }}
          REASON: ${{ needs.classify-change.outputs.reason }}
        run: |
          {
            echo "Classification: ${CLASSIFICATION}."
            echo "Reason: ${REASON}."
            echo 'Scheduled proof family: documentation_contracts.'
            echo 'Expected/observed leaves: 1/1.'
            echo 'Executable, browser, Android, Apple, and packaging proof are not scheduled for a validated documentation-only change.'
            echo 'Remediation: mix crosswake.adoption_context.scan && mix test test/crosswake/guides test/crosswake/proof/phase69_docs_contract_parity_test.exs'
          } >> "$GITHUB_STEP_SUMMARY"

  proof-aggregator-negative-control:
    name: proof-aggregator-negative-control
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Exercise the complete closed result vocabulary
        id: outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 script/check_aggregator_result_semantics.py --self-test
          python3 script/check_aggregator_result_semantics.py --assert-outcomes \
            '{"success":"success","failure":"failure","cancelled":"failure","skipped_disallowed":"failure","skipped_irrelevant":"success","timed_out":"failure","action_required":"failure","stale":"failure","unknown":"failure","empty":"failure","missing":"failure"}'
      - name: Summarize aggregator negative-control proof
        if: always()
        run: |
          echo 'Closed aggregator semantics exercised success, failure, cancelled, skipped, timed_out, action_required, stale, unknown, empty, and missing outcomes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: python3 script/check_aggregator_result_semantics.py --self-test' >> "$GITHUB_STEP_SUMMARY"

  guard-01-contract-drift-test:
    name: guard-01-contract-drift-test
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Run contract drift test (GUARD-01)
        run: mix test test/crosswake/contract/contract_drift_test.exs
      - name: Summarize contract drift test
        if: always()
        run: |
          echo 'GUARD-01 contract-drift-test: focused ExUnit drift assertion completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix test test/crosswake/contract/contract_drift_test.exs' >> "$GITHUB_STEP_SUMMARY"

  guard-02-generate-and-diff:
    name: guard-02-generate-and-diff
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: dev
      - name: Compile
        run: mix compile
      - name: Regenerate contract surfaces
        run: mix crosswake.contract.gen
      - name: Assert no uncommitted drift
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --exit-code; then
            echo '::error::GUARD-02 FAILED — generated contract surfaces are out of date.'
            echo "::error::Run 'mix crosswake.contract.gen' and commit the regenerated outputs."
            git --no-pager diff --cached --stat
            exit 1
          fi
      - name: Summarize generated contract parity
        if: always()
        run: |
          echo 'GUARD-02 generated contract surfaces were regenerated and compared byte-for-byte.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix crosswake.contract.gen && git add -A && git diff --cached --exit-code' >> "$GITHUB_STEP_SUMMARY"

  proof-dependency-security:
    name: proof-dependency-security
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
          install-hex: false
      - name: Install Hex
        run: |
          for attempt in 1 2 3; do
            if mix local.hex --force; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
      - name: Install root audit dependencies
        run: mix deps.get
      - name: Install example-host audit dependencies
        working-directory: examples/phoenix_host
        run: mix deps.get
      - name: Audit both supported dependency locks
        run: script/check_dependency_security.sh
      - name: Prove an advisory-bearing lock fails closed
        run: script/check_dependency_security.sh --assert-vulnerable-fixture test/fixtures/security/advisory-bearing.lock
      - name: Summarize dependency security proof
        if: always()
        run: |
          echo 'Dependency security audits the root and example-host locks independently and rejects the advisory-bearing fixture.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: script/check_dependency_security.sh && script/check_dependency_security.sh --assert-vulnerable-fixture test/fixtures/security/advisory-bearing.lock' >> "$GITHUB_STEP_SUMMARY"

  proof-requires-example-host:
    name: proof-requires-example-host
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Compile the example Phoenix host (dev env)
        env:
          MIX_ENV: dev
        working-directory: examples/phoenix_host
        run: |
          mix deps.get
          mix compile
      - name: Install root Mix dependencies
        env:
          MIX_ENV: test
        run: mix deps.get
      - name: Compile root project
        env:
          MIX_ENV: test
        run: mix compile
      - name: Run the bounded example-host isolation matrix
        env:
          MIX_ENV: test
        run: script/check_example_host_isolation.sh --matrix-only
      - name: Summarize example-host isolation proof
        if: always()
        run: |
          tagged_paths="$(find test -name '*_test.exs' -type f -exec grep -El '^[[:space:]]*@(module)?tag[[:space:]]+:requires_example_host' {} + | sort)"
          tagged_count="$(printf '%s\n' "$tagged_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "GATE-03 executed the bounded :requires_example_host isolation matrix across ${tagged_count} tagged files." >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: script/check_example_host_isolation.sh --matrix-only' >> "$GITHUB_STEP_SUMMARY"

  phase130-core-hermetic-proof:
    name: phase130-core-hermetic-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Run Phase 130 extraction and fail-closed proof
        run: |
          mix test test/crosswake/proof/phase130_extraction_guards_test.exs
          mix test test/crosswake/proof/phase130_fail_closed_contract_test.exs
          mix test --exclude requires_example_host --exclude advisory_only
      - name: Summarize Phase 130 core proof
        if: always()
        run: |
          echo 'Phase 130 core hermetic extraction, fail-closed contract, and broad suite proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix test test/crosswake/proof/phase130_extraction_guards_test.exs test/crosswake/proof/phase130_fail_closed_contract_test.exs && mix test --exclude requires_example_host --exclude advisory_only' >> "$GITHUB_STEP_SUMMARY"

  phase130-companion-engine-absent-proof:
