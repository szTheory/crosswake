        run: |
          echo 'GUARD-02 production route-absence proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: cd examples/phoenix_host && MIX_ENV=prod mix phx.routes CrosswakeExample.Router' >> "$GITHUB_STEP_SUMMARY"

  e2e-proof:
