          echo 'Phase 132 Rindle engine-absent and release-package proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix companions.test && CROSSWAKE_RELEASE=1 bash script/verify_companion_package.sh crosswake_rindle' >> "$GITHUB_STEP_SUMMARY"

