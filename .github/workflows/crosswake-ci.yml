        with:
          mix-env: dev
      - name: Compile and check warnings
        run: mix compile --warnings-as-errors
      - name: Run v4.0 milestone closeout verification
        run: mix closeout.verify --cwd . --closeout-path .planning/milestones/v4.0-CLOSEOUT.md
