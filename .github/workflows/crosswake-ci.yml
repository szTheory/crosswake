      - name: Summarize Phase 132 core proof
        if: always()
        run: |
          echo 'Phase 132 compatibility drift, extraction, and broad hermetic proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix test test/crosswake/proof/phase130_extraction_guards_test.exs test/crosswake/proof/phase132_compat_matrix_drift_test.exs && mix test --exclude requires_example_host --exclude advisory_only' >> "$GITHUB_STEP_SUMMARY"

