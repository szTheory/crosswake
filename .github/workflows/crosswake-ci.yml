        run: |
          echo 'ios-package-unit: Swift behavioral proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: cd packages/crosswake-shell-core-ios && swift test' >> "$GITHUB_STEP_SUMMARY"

