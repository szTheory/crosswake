          mix test test/crosswake/doctor/doctor_test.exs test/crosswake/support_matrix/support_matrix_test.exs test/crosswake/support_matrix/renderer_test.exs test/crosswake/guides/commerce_test.exs
          mix test test/crosswake/planning/summary_frontmatter_test.exs
      - name: Summarize Phase 23 commerce proof
        if: always()
        run: |
          echo 'Phase 23 hermetic commerce, support, doctor, guide, and planning proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix test test/crosswake/proof/phase23_commerce_support_proof_test.exs test/crosswake/doctor/doctor_test.exs test/crosswake/support_matrix test/crosswake/guides/commerce_test.exs test/crosswake/planning/summary_frontmatter_test.exs' >> "$GITHUB_STEP_SUMMARY"

  phase34-commerce-proof:
    name: phase34-commerce-proof
