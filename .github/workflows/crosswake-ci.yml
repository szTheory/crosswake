      - name: Run Phase 41 gating doctor and support matrix proof
        run: |
          mix test test/crosswake/proof/phase41_gating_doctor_test.exs
          mix test --exclude requires_example_host
      - name: Summarize Phase 41 gating proof
        if: always()
        run: |
          echo 'Phase 41 gating doctor, support matrix, formatter, and broad hermetic proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix test test/crosswake/proof/phase41_gating_doctor_test.exs && mix test --exclude requires_example_host' >> "$GITHUB_STEP_SUMMARY"

