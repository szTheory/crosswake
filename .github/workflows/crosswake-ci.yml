      - name: Summarize Phase 79 Android proof
        if: always()
        run: |
          echo 'Remediation: CROSSWAKE_ANDROID_CONNECTED_TESTS=0 ./script/verify_generated_android_shell.sh' >> "$GITHUB_STEP_SUMMARY"

