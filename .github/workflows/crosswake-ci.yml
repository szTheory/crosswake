name: Crosswake CI

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: crosswake-ci-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  classify-change:
    name: classify-change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      schema_version: ${{ steps.classify.outputs.schema_version }}
      classification: ${{ steps.classify.outputs.classification }}
      reason: ${{ steps.classify.outputs.reason }}
      scheduled_families: ${{ steps.classify.outputs.scheduled_families }}
      irrelevant_leaves: ${{ steps.classify.outputs.irrelevant_leaves }}
    steps:
      - name: Check out the synthetic merge with full history
        id: checkout
        continue-on-error: true
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify the validated base-to-merge diff
        id: classify
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          set -euo pipefail
          {
            echo 'schema_version=1'
            echo 'classification=full_proof'
            echo 'reason=checkout_or_object_validation_failed'
            echo 'scheduled_families=["full_proof"]'
            echo 'irrelevant_leaves=[]'
          } >> "$GITHUB_OUTPUT"

          if [ "$CHECKOUT_OUTCOME" != 'success' ]; then
            echo 'Crosswake CI could not acquire full history. Running the full proof set.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha="$BASE_SHA"
          merge_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          if [ -z "$base_sha" ] || [ -z "$merge_sha" ] || \
             ! git cat-file -e "$base_sha^{commit}" 2>/dev/null || \
             ! git cat-file -e "$merge_sha^{commit}" 2>/dev/null; then
            echo 'Crosswake CI could not validate the comparison base. Running the full proof set.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 script/classify_ci_change.py \
            --base "$base_sha" \
            --merge "$merge_sha" \
            --github-output "$GITHUB_OUTPUT" >/dev/null

  documentation-contracts:
    name: documentation-contracts
    needs: [classify-change]
    if: needs.classify-change.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Run first-adopter privacy and documentation contracts
        run: mix crosswake.docs.sync --check && mix crosswake.adoption_context.scan && mix test test/crosswake/guides test/crosswake/capability_map/capability_map_test.exs test/crosswake/support_matrix/renderer_test.exs test/crosswake/proof/phase69_docs_contract_parity_test.exs
      - name: Summarize the documentation contract leaf
        env:
          CLASSIFICATION: ${{ needs.classify-change.outputs.classification }}
          REASON: ${{ needs.classify-change.outputs.reason }}
        run: |
          {
            echo "Classification: ${CLASSIFICATION}."
            echo "Reason: ${REASON}."
            echo 'Scheduled proof family: documentation_contracts.'
            echo 'Expected/observed leaves: 1/1.'
            echo 'Executable, browser, Android, Apple, and packaging proof are not scheduled for a validated documentation-only change.'
            echo 'Remediation: mix crosswake.docs.sync --check && mix crosswake.adoption_context.scan && mix test test/crosswake/guides test/crosswake/capability_map/capability_map_test.exs test/crosswake/support_matrix/renderer_test.exs test/crosswake/proof/phase69_docs_contract_parity_test.exs'
          } >> "$GITHUB_STEP_SUMMARY"

  brand-structural:
    name: brand-structural
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof' || contains(fromJSON(needs.classify-change.outputs.scheduled_families), 'public_docs')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - name: Install brandbook tool dependencies
        working-directory: brandbook/tools
        run: npm ci
      - name: Size budget (committed brandbook <= 1MB)
        run: |
          TOTAL=$(git ls-files brandbook | xargs -I{} stat -c%s {} | awk '{s+=$1} END{print s+0}')
          echo "Committed brandbook bytes: $TOTAL"
          if [ "$TOTAL" -gt 1048576 ]; then
            echo "ERROR: brandbook exceeds 1MB budget ($TOTAL bytes > 1048576)"
            exit 1
          fi
          echo "Size budget OK ($TOTAL / 1048576 bytes)"
      - name: SVG structural validation - production marks
        working-directory: brandbook/tools
        run: node check-production.mjs
      - name: SVG structural validation - candidate marks
        working-directory: brandbook/tools
        run: node check-candidates.mjs
      - name: Token JSON round-trip
        working-directory: brandbook/tools
        run: node --test compile-tokens.test.mjs
      - name: WCAG contrast matrix
        working-directory: brandbook/tools
        run: node --test contrast.test.mjs
      - name: Consumer drift gate (no hex / no primitives / semantic coverage)
        working-directory: brandbook/tools
        run: node check-consumer-drift.mjs
      - name: Consumer drift gate contract tests
        working-directory: brandbook/tools
        run: node --test check-consumer-drift.test.mjs
      - name: Install brand e2e dependencies
        working-directory: brandbook/e2e
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: brandbook/e2e
        run: npx playwright install --with-deps chromium
      - name: Structural brand checks (DOM, dimensions, source assertions)
        working-directory: brandbook/e2e
        run: npm run test:structural
      - name: Summarize required brand structural proof
        if: always()
        run: |
          echo 'Brand structure, tokens, contrast, consumer drift, and DOM dimensions were checked.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: cd brandbook/tools && npm ci && node check-production.mjs && node check-candidates.mjs && node --test compile-tokens.test.mjs contrast.test.mjs check-consumer-drift.test.mjs && node check-consumer-drift.mjs && cd ../e2e && npm ci && npx playwright install --with-deps chromium && npm run test:structural' >> "$GITHUB_STEP_SUMMARY"

  brand-visual:
    name: brand-visual
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof' || contains(fromJSON(needs.classify-change.outputs.scheduled_families), 'public_docs')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - name: Install brand e2e dependencies
        working-directory: brandbook/e2e
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: brandbook/e2e
        run: npx playwright install --with-deps chromium
      - name: Visual render + pixel-sample checks
        working-directory: brandbook/e2e
        run: npm run test:visual
      - name: Advisory lane notice
        run: echo 'brand-visual is visible advisory evidence and is intentionally outside Crosswake CI required authority.' >> "$GITHUB_STEP_SUMMARY"

  collateral-binaries-guard:
    name: collateral-binaries-guard
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof' || contains(fromJSON(needs.classify-change.outputs.scheduled_families), 'public_docs')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
      COLLATERAL_REQUIRE_NATIVE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Guard collateral binaries (existence + non-empty + size budget)
        run: bash script/collateral-guard.sh
      - name: Summarize collateral proof
        if: always()
        run: |
          echo 'Collateral binaries were checked for required presence, non-empty content, and size bounds.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: bash script/collateral-guard.sh' >> "$GITHUB_STEP_SUMMARY"

  hex-page-proof:
    name: hex-page-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof' || contains(fromJSON(needs.classify-change.outputs.scheduled_families), 'public_docs')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ExDoc is intentionally dev-only. Keep the package/docs lane in dev and
    # scope test only to the library suite, matching the retired proof lane.
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: dev
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Enforce first-adopter privacy gate
        run: mix crosswake.adoption_context.scan
      - name: Run library test suite (hermetic)
        env:
          MIX_ENV: test
        run: mix test --exclude requires_example_host
      - name: Build docs (smoke)
        run: |
          mix docs
          test -f doc/index.html
          test -f doc/see_it_run.html
      - name: Verify hex tarball contents
        run: bash script/verify_hex_tarball.sh
      - name: Hex publish dry-run (credential-free)
        run: bash script/verify_hex_publish_dry_run.sh
      - name: Summarize Hex page proof
        if: always()
        run: |
          echo 'Hex package metadata, rendered docs, tarball contents, and credential-free dry-run publish proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix compile --warnings-as-errors && mix crosswake.adoption_context.scan && mix test --exclude requires_example_host && mix docs && bash script/verify_hex_tarball.sh && bash script/verify_hex_publish_dry_run.sh' >> "$GITHUB_STEP_SUMMARY"

  release-as-staleness-proof:
    name: release-as-staleness-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check for stale release-as pins
        run: ./script/check_release_as_staleness.sh
      - name: Summarize release-as staleness proof
        if: always()
        run: |
          echo 'Release-as pins were checked against authoritative package release tags.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: ./script/check_release_as_staleness.sh' >> "$GITHUB_STEP_SUMMARY"

  proof-aggregator-negative-control:
    name: proof-aggregator-negative-control
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Exercise the complete closed result vocabulary
        id: outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 script/check_aggregator_result_semantics.py --self-test
          python3 script/check_aggregator_result_semantics.py --assert-outcomes \
            '{"success":"success","failure":"failure","cancelled":"failure","skipped_disallowed":"failure","skipped_irrelevant":"success","timed_out":"failure","action_required":"failure","stale":"failure","unknown":"failure","empty":"failure","missing":"failure"}'
      - name: Summarize aggregator negative-control proof
        if: always()
        run: |
          echo 'Closed aggregator semantics exercised success, failure, cancelled, skipped, timed_out, action_required, stale, unknown, empty, and missing outcomes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: python3 script/check_aggregator_result_semantics.py --self-test' >> "$GITHUB_STEP_SUMMARY"

  guard-01-contract-drift-test:
    name: guard-01-contract-drift-test
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.14.0"
      - name: Verify repository formatting
        run: script/verify_repository.sh --stage format-proof
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Run contract drift test (GUARD-01)
        run: mix test test/crosswake/contract/contract_drift_test.exs
      - name: Summarize contract drift test
        if: always()
        run: |
          echo 'GUARD-01 contract-drift-test: focused ExUnit drift assertion completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix test test/crosswake/contract/contract_drift_test.exs' >> "$GITHUB_STEP_SUMMARY"

  guard-02-generate-and-diff:
    name: guard-02-generate-and-diff
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: dev
      - name: Verify generated contracts without staging
        run: script/verify_repository.sh --stage repository-cleanliness
      - name: Summarize generated contract parity
        if: always()
        run: |
          echo 'GUARD-02 generated contract surfaces were regenerated and compared byte-for-byte.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: script/verify_repository.sh --stage repository-cleanliness' >> "$GITHUB_STEP_SUMMARY"

  proof-dependency-security:
    name: proof-dependency-security
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
          install-hex: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.14.0"
      - name: Install Hex
        run: |
          for attempt in 1 2 3; do
            if mix local.hex --force; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 2
          done
      - name: Install root audit dependencies
        run: mix deps.get
      - name: Verify repository prerequisites
        run: script/verify_repository.sh --stage repository-preflight
      - name: Install example-host audit dependencies
        working-directory: examples/phoenix_host
        run: mix deps.get
      - name: Audit both supported dependency locks
        run: script/check_dependency_security.sh
      - name: Prove an advisory-bearing lock fails closed
        run: script/check_dependency_security.sh --assert-vulnerable-fixture test/fixtures/security/advisory-bearing.lock
      - name: Summarize dependency security proof
        if: always()
        run: |
          echo 'Dependency security audits the root and example-host locks independently and rejects the advisory-bearing fixture.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: script/check_dependency_security.sh && script/check_dependency_security.sh --assert-vulnerable-fixture test/fixtures/security/advisory-bearing.lock' >> "$GITHUB_STEP_SUMMARY"

  proof-requires-example-host:
    name: proof-requires-example-host
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.14.0"
      - name: Compile the example Phoenix host (dev env)
        env:
          MIX_ENV: dev
        working-directory: examples/phoenix_host
        run: |
          mix deps.get
          mix compile
      - name: Install example Phoenix host test dependencies
        env:
          MIX_ENV: test
        working-directory: examples/phoenix_host
        run: mix deps.get
      - name: Install root Mix dependencies
        env:
          MIX_ENV: test
        run: mix deps.get
      - name: Compile root project
        env:
          MIX_ENV: test
        run: mix compile
      - name: Run the bounded example-host isolation matrix
        run: script/verify_repository.sh --stage example-host-proof
      - name: Summarize example-host isolation proof
        if: always()
        run: |
          tagged_paths="$(find test -name '*_test.exs' -type f -exec grep -El '^[[:space:]]*@(module)?tag[[:space:]]+:requires_example_host' {} + | sort)"
          tagged_count="$(printf '%s\n' "$tagged_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "GATE-03 executed the bounded :requires_example_host isolation matrix across ${tagged_count} tagged files." >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: script/check_example_host_isolation.sh --matrix-only' >> "$GITHUB_STEP_SUMMARY"

  phase130-core-hermetic-proof:
    name: phase130-core-hermetic-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.14.0"
      - name: Run root and companion proof
        run: script/verify_repository.sh --stage root-proof
      - name: Summarize Phase 130 core proof
        if: always()
        run: |
          echo 'Phase 130 core hermetic extraction, fail-closed contract, and broad suite proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix test test/crosswake/proof/phase130_extraction_guards_test.exs test/crosswake/proof/phase130_fail_closed_contract_test.exs && mix test --exclude requires_example_host --exclude advisory_only' >> "$GITHUB_STEP_SUMMARY"

  phase130-companion-engine-absent-proof:
    name: phase130-companion-engine-absent-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
          cache-scope: companion-rulestead
          working-directory: packages/crosswake_rulestead
      - name: Compile companion (warnings as errors, engine absent)
        working-directory: packages/crosswake_rulestead
        run: mix compile --warnings-as-errors
      - name: Run Rulestead companion and release-package proof
        run: |
          mix companions.test
          bash script/verify_companion_package.sh crosswake_rulestead
      - name: Summarize Phase 130 companion proof
        if: always()
        run: |
          echo 'Phase 130 Rulestead engine-absent and release-package proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix companions.test && bash script/verify_companion_package.sh crosswake_rulestead' >> "$GITHUB_STEP_SUMMARY"

  phase132-core-hermetic-proof:
    name: phase132-core-hermetic-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Run Phase 132 compatibility and broad hermetic proof
        run: |
          mix test test/crosswake/proof/phase130_extraction_guards_test.exs
          mix test test/crosswake/proof/phase132_compat_matrix_drift_test.exs
          mix test --exclude requires_example_host --exclude advisory_only
      - name: Summarize Phase 132 core proof
        if: always()
        run: |
          echo 'Phase 132 compatibility drift, extraction, and broad hermetic proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix test test/crosswake/proof/phase130_extraction_guards_test.exs test/crosswake/proof/phase132_compat_matrix_drift_test.exs && mix test --exclude requires_example_host --exclude advisory_only' >> "$GITHUB_STEP_SUMMARY"

  phase132-companion-engine-absent-proof:
    name: phase132-companion-engine-absent-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
          cache-scope: companion-rindle
          working-directory: packages/crosswake_rindle
      - name: Compile Rindle companion (warnings as errors)
        working-directory: packages/crosswake_rindle
        run: mix compile --warnings-as-errors
      - name: Run companion and Rindle release-package proof
        run: |
          mix companions.test
          CROSSWAKE_RELEASE=1 bash script/verify_companion_package.sh crosswake_rindle
      - name: Summarize Phase 132 companion proof
        if: always()
        run: |
          echo 'Phase 132 Rindle engine-absent and release-package proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix companions.test && CROSSWAKE_RELEASE=1 bash script/verify_companion_package.sh crosswake_rindle' >> "$GITHUB_STEP_SUMMARY"

  phase23-commerce-proof:
    name: phase23-commerce-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Run Phase 23 commerce, support, doctor, guide, and planning proof
        run: |
          mix test test/crosswake/proof/phase23_commerce_support_proof_test.exs
          mix test test/crosswake/doctor/doctor_test.exs test/crosswake/support_matrix/support_matrix_test.exs test/crosswake/support_matrix/renderer_test.exs test/crosswake/guides/commerce_test.exs
          mix test test/crosswake/planning/summary_frontmatter_test.exs
      - name: Summarize Phase 23 commerce proof
        if: always()
        run: |
          echo 'Phase 23 hermetic commerce, support, doctor, guide, and planning proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix test test/crosswake/proof/phase23_commerce_support_proof_test.exs test/crosswake/doctor/doctor_test.exs test/crosswake/support_matrix test/crosswake/guides/commerce_test.exs test/crosswake/planning/summary_frontmatter_test.exs' >> "$GITHUB_STEP_SUMMARY"

  phase34-commerce-proof:
    name: phase34-commerce-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
