  phase58-auth-closeout-proof:
    name: phase58-auth-closeout-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Run closeout verification with Phase 58 security artifact
        run: mix closeout.verify --security-only --security-closeout .planning/milestones/v3.8-phases/58-auth-diagnostics-proof-and-security-closeout/58-SECURITY.md
      - name: Run layered Sigra auth proof (core-side)
        run: |
          mix test --exclude requires_example_host \
            test/crosswake/proof/phase55_session_handoff_tickets_test.exs \
            test/crosswake/proof/phase56_step_up_ceremony_test.exs
      - name: Run Sigra diagnostics parity tests (core-side)
        run: |
          mix test \
            test/crosswake/support_matrix/support_matrix_test.exs \
            test/crosswake/doctor/doctor_test.exs \
            test/crosswake/guides/companions_test.exs \
            test/mix/tasks/closeout_verify_test.exs
      - name: Install crosswake_sigra dependencies
        working-directory: packages/crosswake_sigra
        run: mix deps.get
      - name: Run layered Sigra auth proof (crosswake_sigra)
        working-directory: packages/crosswake_sigra
        run: |
          mix test --exclude requires_example_host \
            test/crosswake/proof/phase54_sigra_session_authority_test.exs \
            test/crosswake/proof/phase57_auth_return_boundaries_test.exs \
            test/crosswake/proof/phase58_auth_diagnostics_closeout_test.exs
      - name: Run Sigra diagnostics parity tests (crosswake_sigra)
        working-directory: packages/crosswake_sigra
        run: |
          mix test \
            test/crosswake/companions/sigra/telemetry_test.exs \
            test/crosswake/operator_inspection/operator_inspection_test.exs \
            test/crosswake/doctor/publish_readiness_test.exs
      - name: Summarize auth closeout proof
        if: always()
        run: |
          echo 'Phase 58 security closeout and layered core/companion auth proof completed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Remediation: mix closeout.verify --security-only --security-closeout .planning/milestones/v3.8-phases/58-auth-diagnostics-proof-and-security-closeout/58-SECURITY.md' >> "$GITHUB_STEP_SUMMARY"

