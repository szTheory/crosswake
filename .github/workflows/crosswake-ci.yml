  phase96-threadline-docs-contract-proof:
    name: phase96-threadline-docs-contract-proof
    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof' || contains(fromJSON(needs.classify-change.outputs.scheduled_families), 'threadline_docs_contract')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"
      - name: Install Elixir dependencies
        run: mix deps.get
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
      - name: Run hermetic Threadline docs contract proof
        run: >-
          mix test
          test/crosswake/proof/phase91_threadline_contract_closeout_test.exs
          test/crosswake/proof/phase92_server_propagation_closeout_test.exs
          test/crosswake/proof/phase96_threadline_docs_contract_test.exs
          test/crosswake/plug/threadline_test.exs
          test/crosswake/live/threadline_test.exs
          test/crosswake/threadline/telemetry_test.exs
          test/crosswake/threadline/id_test.exs
          test/crosswake/doctor/doctor_threadline_test.exs
          test/mix/tasks/crosswake.gen.audit_test.exs
          "test/crosswake/support_matrix/support_matrix_test.exs:246"
      - name: Summarize Threadline docs-contract proof
        if: always()
        run: |
          {
            echo 'Focused Threadline public documentation and runtime contract proof completed.'
            echo 'Focused remediation: mix test test/crosswake/proof/phase96_threadline_docs_contract_test.exs test/crosswake/plug/threadline_test.exs test/crosswake/live/threadline_test.exs test/crosswake/threadline/telemetry_test.exs'
            echo 'Remediation: mix test test/crosswake/proof/phase91_threadline_contract_closeout_test.exs test/crosswake/proof/phase92_server_propagation_closeout_test.exs test/crosswake/proof/phase96_threadline_docs_contract_test.exs test/crosswake/plug/threadline_test.exs test/crosswake/live/threadline_test.exs test/crosswake/threadline/telemetry_test.exs test/crosswake/threadline/id_test.exs test/crosswake/doctor/doctor_threadline_test.exs test/mix/tasks/crosswake.gen.audit_test.exs "test/crosswake/support_matrix/support_matrix_test.exs:246"'
          } >> "$GITHUB_STEP_SUMMARY"

