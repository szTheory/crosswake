  merge-blocking-crosswake-ci:
    name: Crosswake CI
    if: always()
    needs:
      - android-generated-shell-unit
      - android-package-unit
      - classify-change
      - documentation-contracts
      - e2e-proof
      - guard-01-contract-drift-test
      - guard-01-e2e-honesty
      - guard-02-generate-and-diff
      - guard-02-prod-route-absence
      - ios-mirror-parity-proof
      - ios-package-unit
      - phase10-proof
      - phase18-elixir-android-proof
      - phase18-ios-proof
      - phase130-companion-engine-absent-proof
      - phase130-core-hermetic-proof
      - phase132-companion-engine-absent-proof
      - phase132-core-hermetic-proof
      - phase23-commerce-proof
      - phase34-commerce-proof
      - phase5-proof
      - phase41-gating-proof
      - phase43-rulestead-proof
      - phase45-rindle-proof
      - phase48-provider-adapter-proof
      - phase52-operator-proof
      - phase58-auth-closeout-proof
      - phase67-android-jvm-proof
      - phase69-closeout-proof
      - phase70-subscription-saas-proof
      - phase71-notification-workflow-proof
      - phase73-auth-sensitive-admin-workflow-proof
      - phase74-offline-draft-recovery-proof
      - phase75-closeout-gate
      - phase79-android-proof
      - phase79-ios-proof
      - phase96-threadline-docs-contract-proof
      - proof-aggregator-negative-control
      - proof-dependency-security
      - proof-requires-example-host
      - route-tour-proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conclude the governed proof graph
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CLASSIFICATION: ${{ needs.classify-change.outputs.classification }}
          REASON: ${{ needs.classify-change.outputs.reason }}
          SCHEDULED_FAMILIES: ${{ needs.classify-change.outputs.scheduled_families }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          classification = os.environ.get("CLASSIFICATION", "")
          if classification not in {"documentation_only", "full_proof"}:
              sys.exit("Crosswake CI: classification was missing or unknown")
          if classification == "documentation_only" and os.environ.get("REASON", "") != "all_changed_paths_allowlisted":
              sys.exit("Crosswake CI: documentation irrelevance reason was not manifest-authorized")
          explicitly_irrelevant = {
              "android-generated-shell-unit",
              "android-package-unit",
              "e2e-proof",
              "guard-01-contract-drift-test",
              "guard-01-e2e-honesty",
              "guard-02-generate-and-diff",
              "guard-02-prod-route-absence",
              "ios-mirror-parity-proof",
              "ios-package-unit",
              "phase10-proof",
              "phase18-elixir-android-proof",
              "phase18-ios-proof",
              "phase130-companion-engine-absent-proof",
              "phase130-core-hermetic-proof",
              "phase132-companion-engine-absent-proof",
              "phase132-core-hermetic-proof",
              "phase23-commerce-proof",
              "phase34-commerce-proof",
              "phase41-gating-proof",
              "phase43-rulestead-proof",
              "phase45-rindle-proof",
              "phase48-provider-adapter-proof",
              "phase5-proof",
              "phase52-operator-proof",
              "phase58-auth-closeout-proof",
              "phase67-android-jvm-proof",
              "phase69-closeout-proof",
              "phase70-subscription-saas-proof",
              "phase71-notification-workflow-proof",
              "phase73-auth-sensitive-admin-workflow-proof",
              "phase74-offline-draft-recovery-proof",
              "phase75-closeout-gate",
              "phase79-android-proof",
              "phase79-ios-proof",
              "phase96-threadline-docs-contract-proof",
              "proof-aggregator-negative-control",
              "proof-dependency-security",
              "proof-requires-example-host",
              "route-tour-proof",
          } if classification == "documentation_only" else set()
          for name, value in sorted(needs.items()):
              result = value.get("result", "")
              if name == "classify-change" and result != "success":
                  sys.exit("Crosswake CI: required classification control did not succeed")
              if name != "classify-change" and result != "success":
                  if result != "skipped" or name not in explicitly_irrelevant:
                      sys.exit("Crosswake CI: proof leaf did not reach a closed accepted result: " + name)
          PY
          {
            echo "Crosswake CI: ${CLASSIFICATION}."
            echo "Reason: ${REASON}."
            echo "Scheduled proof families: ${SCHEDULED_FAMILIES}."
            echo 'Explicitly irrelevant families: core_integrity, security, example_host, native_android, native_ios, offline_browser.'
            echo 'Expected proof leaves: 40.'
            echo 'Remediation: python3 script/check_ci_leaf_manifest.py --self-test'
          } >> "$GITHUB_STEP_SUMMARY"
