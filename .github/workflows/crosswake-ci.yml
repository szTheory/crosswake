    needs: [classify-change]
    if: needs.classify-change.outputs.classification == 'full_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Assert no test-only E2E route in a prod compile
        working-directory: examples/phoenix_host
        run: |
          set -euo pipefail
          rm -rf _build/prod
          mix deps.get --only prod
          routes="$(mix phx.routes CrosswakeExample.Router)"
          echo "$routes"
          if echo "$routes" | grep -qE '/_e2e(/|$)'; then
            echo '::error::GUARD-02 FAILED — /_e2e route present in a MIX_ENV=prod compile.'
            exit 1
          fi
      - name: Summarize production route-absence proof
