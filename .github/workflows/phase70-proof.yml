name: Phase 70 Advisory Proof

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  advisory-provider-sandbox-device-proof:
    name: advisory provider sandbox/device proof (storekit + play billing)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Setup BEAM and restore Elixir caches
        uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
      - name: Advisory StoreKit sandbox/device checks
        env:
          CROSSWAKE_STOREKIT_SANDBOX_READY: ${{ secrets.CROSSWAKE_STOREKIT_SANDBOX_READY }}
        run: |
          if [ -z "${CROSSWAKE_STOREKIT_SANDBOX_READY}" ]; then
            echo "::notice title=Advisory StoreKit::credentials missing; skipping non-blocking StoreKit sandbox/device checks."
            exit 0
          fi
          echo "::notice title=Advisory StoreKit::credentials present; run host-specific StoreKit sandbox/device script here."
      - name: Advisory Play Billing sandbox/device checks
        env:
          CROSSWAKE_PLAY_BILLING_SANDBOX_READY: ${{ secrets.CROSSWAKE_PLAY_BILLING_SANDBOX_READY }}
        run: |
          if [ -z "${CROSSWAKE_PLAY_BILLING_SANDBOX_READY}" ]; then
            echo "::notice title=Advisory Play Billing::credentials missing; skipping non-blocking Play Billing sandbox/device checks."
            exit 0
          fi
          echo "::notice title=Advisory Play Billing::credentials present; run host-specific Play Billing sandbox/device script here."
      - name: Advisory lane status summary
        run: |
          echo "::notice title=Advisory lane::Provider sandbox/device checks are advisory only."
          echo "::notice::This job never gates merge and passing runs do not auto-promote support posture."
