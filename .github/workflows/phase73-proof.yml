name: Phase 73 Proof

permissions:
  # permissions: contents: read
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      lane:
        description: "Proof lane to run"
        required: true
        default: merge-blocking
        type: choice
        options:
          - merge-blocking
          - advisory
          - all
  schedule:
    - cron: "0 6 * * 1"

env:
  DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer

jobs:
  merge-blocking-auth-sensitive-admin-workflow-proof:
    name: merge-blocking auth-sensitive admin workflow proof (hermetic)
    runs-on: macos-15
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'merge-blocking' || inputs.lane == 'all')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup BEAM
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # Phase 73 auth-sensitive admin workflow proof moved into crosswake_sigra during the
      # SIGRA-01 extraction (Phase 137). Run it from the package (crosswake resolves via path dep).
      - name: Install crosswake_sigra dependencies
        run: mix deps.get
        working-directory: packages/crosswake_sigra

      - name: Run hermetic Phase 73 auth-sensitive admin workflow proof
        run: mix test test/crosswake/proof/phase73_auth_sensitive_admin_workflow_proof_test.exs
        working-directory: packages/crosswake_sigra

  advisory-native-auth-device-audit-proof:
    name: advisory native auth/device/audit proof (non-promoting)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'advisory' || inputs.lane == 'all')) }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Advisory admin auth notice
        run: |
          echo "::notice title=Advisory admin auth lane::Provider/device auth proof and native auth UI are advisory/deferred and never gate merge."
          echo "::notice title=Advisory admin auth lane::Persistent shell session state is evidence only and does not grant admin access."
          echo "::notice title=Advisory admin auth lane::Threadline-style generic audit machinery remains deferred; Phase 73 proves the Sigra example-host admin audit posture only."
