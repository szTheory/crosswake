name: Phase 71 Proof

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  # permissions: contents: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Proof lane to run"
        required: true
        default: merge-blocking
        type: choice
        options:
          - merge-blocking
          - advisory
          - all
  schedule:
    - cron: "0 6 * * 1"

jobs:
  advisory-push-provider-device-proof:
    name: advisory push provider/device proof (non-delivery)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'advisory' || inputs.lane == 'all')) }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Advisory notification provider/device notice
        run: |
          echo "::notice title=Advisory notification lane::APNs/FCM delivery is advisory only and never gates merge."
          echo "::notice title=Advisory notification lane::Native tray behavior, Focus/Doze/background delivery, and real devices are advisory only."
          echo "::notice title=Advisory notification lane::Passing this lane does not auto-promote support posture."
