name: Phase 71 Proof

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  # permissions: contents: read
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      lane:
        description: "Proof lane to run"
        required: true
        default: merge-blocking
        type: choice
        options:
          - merge-blocking
          - advisory
          - all
  schedule:
    - cron: "0 6 * * 1"

jobs:
  merge-blocking-notification-workflow-proof:
    name: merge-blocking notification workflow proof (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'merge-blocking' || inputs.lane == 'all')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup BEAM and restore Elixir caches
        uses: ./.github/actions/setup-elixir-cache
        with:
          # test, not dev: `mix test` below compiles lib PLUS the test files and
          # is the larger of this lane's two compiles. The `mix compile` step is
          # still a cold dev-env compile — see the double-compile note in
          # 153.1-03-RESULTS.md; collapsing the two would change which Mix.env()
          # the warnings check runs under, which is not a silent change to make
          # across 11 merge-blocking gates.
          mix-env: test

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # Phase 71 notification workflow proof is a chimeway-domain (notification) proof and now
      # lives in crosswake_chimeway after the CHIME-01 extraction (Phase 138). Run it from the
      # package (core resolved via path dep). The Phase 137 wiring pointed at crosswake_sigra,
      # but this notification proof followed chimeway, not sigra — corrected in Phase 140.
      - name: Install crosswake_chimeway dependencies
        run: mix deps.get
        working-directory: packages/crosswake_chimeway

      - name: Run hermetic Phase 71 notification workflow proof
        run: mix test test/crosswake/proof/phase71_notification_workflow_proof_test.exs
        working-directory: packages/crosswake_chimeway

  advisory-push-provider-device-proof:
    name: advisory push provider/device proof (non-delivery)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'advisory' || inputs.lane == 'all')) }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Advisory notification provider/device notice
        run: |
          echo "::notice title=Advisory notification lane::APNs/FCM delivery is advisory only and never gates merge."
          echo "::notice title=Advisory notification lane::Native tray behavior, Focus/Doze/background delivery, and real devices are advisory only."
          echo "::notice title=Advisory notification lane::Passing this lane does not auto-promote support posture."
