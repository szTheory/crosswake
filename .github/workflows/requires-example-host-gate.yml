name: Requires Example Host Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# GATE-03 — the only CI lane that executes the :requires_example_host tag.
#
# WHY THIS EXISTS:
#   Tests carrying the :requires_example_host tag need one dedicated required lane; the live set is
#   derived in the summary below rather than copied into this workflow. Before this lane, broad
#   workflows excluded the class and no required workflow selected it, so regressions could reach
#   main with every check
#   green. That is not hypothetical: the red gate fixed in #89 sat undetected on main precisely
#   because nothing here executed it.
#
#   The tag is legitimate — these tests need the checked-in example Phoenix app compiled, which
#   most lanes have no reason to build. The defect was that "excluded everywhere" was mistaken for
#   "covered somewhere". This lane is that somewhere.
#
# EXAMPLE-HOST BUILD:
#   test/support/example_host.ex `load!/0` prepends `examples/phoenix_host/_build/dev/lib/*/ebin`
#   at runtime. The example app must therefore be compiled in the DEV env, in its own directory,
#   before the root suite runs. Compiling only the root project leaves CrosswakeExample.* undefined
#   and every test in this lane errors in setup.
#
# REGISTRATION (maintainer, out-of-band, AFTER this goes green on main at least once):
#   DRY_RUN=0 script/register_required_checks.sh
#   The job name below carries the "merge-blocking" substring, so
#   script/list_merge_blocking_checks.py discovers it with no new registration code.
#   Do NOT register before it is green on main — an unsatisfiable required context blocks every PR.

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  merge-blocking-requires-example-host:
    name: merge-blocking-requires-example-host
    runs-on: ubuntu-latest
    # No Apple toolchain anywhere in this lane: pure Elixir plus the example Phoenix app.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Compile the example Phoenix host (dev env)
        # MIX_ENV=dev is load-bearing, not a default: example_host.ex globs _build/DEV/lib/*/ebin.
        # Building this in :test would leave that glob empty and every test would fail in setup.
        env:
          MIX_ENV: dev
        working-directory: examples/phoenix_host
        run: |
          mix deps.get
          mix compile

      - name: Install root Mix dependencies
        env:
          MIX_ENV: test
        run: mix deps.get

      - name: Compile root project
        env:
          MIX_ENV: test
        run: mix compile

      - name: Run the bounded example-host isolation matrix
        env:
          MIX_ENV: test
        # The explicit dev/test compile steps above remain the lane's build authority. This mode
        # runs the same six seed/class combinations as the canonical script without repeating them.
        run: script/check_example_host_isolation.sh --matrix-only

      - name: Step summary
        if: always()
        run: |
          tagged_paths="$(find test -name '*_test.exs' -type f -exec grep -El '^[[:space:]]*@(module)?tag[[:space:]]+:requires_example_host' {} + | sort)"
          tagged_count="$(printf '%s\n' "$tagged_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "GATE-03 — executed the bounded parallel :requires_example_host isolation matrix." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged files discovered live: ${tagged_count}." >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$tagged_paths" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
