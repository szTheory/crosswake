name: Offline-Sync E2E Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
# Renamed from phase90-proof.yml (2026-06). Permanent merge gate — purpose-named, not phase-scoped.
#
# TOPOLOGY (Option-C aggregator — D-01):
#   Three sibling jobs produce per-signal red/green dots; one aggregator is the ONLY required check.
#   Branch-protection required-check name: merge-blocking-offline-sync-e2e
#
# REGISTRATION (run out-of-band by maintainer after this workflow goes green on main):
#
#   Ordering — must follow this sequence to avoid "Expected — Waiting for status" deadlock:
#     1. Merge this PR / the rename PR (offline-sync-e2e-gate.yml with aggregator topology).
#     2. Let merge-blocking-offline-sync-e2e go GREEN on main at least once.
#     3. Run the registration script (step 3 is harness-blocked; maintainer only):
#
#        script/register-e2e-gate.sh
#
#        Equivalent gh api one-liner (for reference / auditing):
#          EP="repos/szTheory/crosswake/branches/main/protection/required_status_checks"
#          current="$(gh api "$EP")"
#          desired="$(jq -n --argjson cur "$current" --arg new "merge-blocking-offline-sync-e2e" \
#            --arg old "e2e-offline-sync" --argjson app 15368 \
#            '{ strict: $cur.strict,
#               checks: (($cur.checks // []) | map(select(.context != $old))
#                        + [{context:$new, app_id:$app}] | unique_by(.context)) }')"
#          gh api -X PATCH "$EP" --input <(echo "$desired")
#
#   This preserves the two existing required checks
#   ("merge-blocking rulestead proof (hermetic)" and "brand-structural") and strict: true.
#   The granular required_status_checks endpoint is used — not the full PUT .../protection —
#   so enforce_admins and review requirements are left untouched.

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  guard-01-e2e-honesty:                 # ~10s, no browser, no Elixir
    name: guard-01-e2e-honesty
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Node dependencies (provides typescript for AST check)
        run: npm ci --prefix examples/phoenix_host
      - name: Run E2E honesty check
        run: node script/check-e2e-honesty.mjs
      # Phase 154 / CTRL-01+CTRL-02: the library-owned bridge hook's unit suite.
      # Deliberately a named STEP inside this existing Node-provisioned job rather
      # than a new workflow or a new required check (D-47): a step name is free, a
      # check name costs the rename-and-registration ritual. The suite has zero
      # dependencies — it is Node's built-in runner over a hand-stubbed global, so
      # no `npm ci` runs here.
      - name: Run the bridge hook unit tests (priv/static/crosswake.esm.js)
        run: node --test "test/js/*.mjs"
      - name: Step summary
        run: |
          echo "GUARD-01 e2e-honesty: structural check passed" >> "$GITHUB_STEP_SUMMARY"

  guard-02-prod-route-absence:          # MIX_ENV=prod — ISOLATED runner
    name: guard-02-prod-route-absence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict
      # No _build cache here BY DESIGN. The step below opens with
      # `rm -rf _build/prod` because this guard is only meaningful against a
      # clean prod compile — so a restored cache was deleted microseconds after
      # being downloaded. Restoring it cost time and proved nothing.
      - name: Assert NO /_e2e route in a prod compile
        working-directory: examples/phoenix_host
        run: |
          set -euo pipefail
          rm -rf _build/prod
          mix deps.get --only prod
          ROUTES="$(mix phx.routes CrosswakeExample.Router)"
          echo "$ROUTES"
          if echo "$ROUTES" | grep -qE '/_e2e(/|$)'; then
            echo "::error::GUARD-02 FAILED — /_e2e route present in a MIX_ENV=prod compile."
            echo "Gate test-only routes with 'if Mix.env() in [:test, :e2e]' so they compile OUT of prod."
            echo "$ROUTES" | grep -E '/_e2e(/|$)'
            exit 1
          fi
          echo "GUARD-02 OK — no /_e2e routes in prod." >> "$GITHUB_STEP_SUMMARY"

  e2e-proof:                            # MIX_ENV=test — ISOLATED runner
    name: e2e-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
          working-directory: examples/phoenix_host
      - name: Compile (warnings as errors)
        working-directory: examples/phoenix_host
        run: mix compile --warnings-as-errors
      - name: Phoenix route + controller assertions
        working-directory: examples/phoenix_host
        run: mix test test/crosswake_example/router_test.exs test/crosswake_example/e2e/sync_state_controller_test.exs
      - name: Install Node dependencies
        working-directory: examples/phoenix_host
        run: npm ci
      - name: Install Playwright browsers
        working-directory: examples/phoenix_host
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        working-directory: examples/phoenix_host
        run: npx playwright test
      - name: Step summary
        run: |
          echo "E2E: offline-sync IndexedDB-outbox → reconnect-flush → one Ecto row proven" >> "$GITHUB_STEP_SUMMARY"

  route-tour-proof:                     # MIX_ENV=test — required browser route-owner collateral
    name: route-tour-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir-cache
        with:
          mix-env: test
          working-directory: examples/phoenix_host
      - name: Compile (warnings as errors)
        working-directory: examples/phoenix_host
        run: mix compile --warnings-as-errors
      - name: Resolve Crosswake version
        id: crosswake-version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  @version "\(.*\)" #.*/\1/p' mix.exs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Phoenix route assertions
        working-directory: examples/phoenix_host
        run: mix test test/crosswake_example/router_test.exs test/crosswake_example/e2e/sync_state_controller_test.exs
      - name: Install Node dependencies
        working-directory: examples/phoenix_host
        run: npm ci
      - name: Install Playwright browsers
        working-directory: examples/phoenix_host
        run: npx playwright install --with-deps chromium
      - name: Run route-tour Playwright proof
        working-directory: examples/phoenix_host
        env:
          CROSSWAKE_VERSION: ${{ steps.crosswake-version.outputs.version }}
        run: npx playwright test e2e/route_tour.spec.ts
      - name: Assert route-tour required evidence files
        run: |
          set -euo pipefail
          route_tour_root="examples/phoenix_host/playwright-artifacts/route-tour"
          required_route_tour_files=(
            "$route_tour_root/evidence-manifest.json"
            "$route_tour_root/screenshots/showcase-hub.png"
            "$route_tour_root/screenshots/adminpilot-dashboard.png"
            "$route_tour_root/screenshots/adminpilot-approvals.png"
            "$route_tour_root/screenshots/adminpilot-approval-approved.png"
            "$route_tour_root/screenshots/adminpilot-diagnostics.png"
            "$route_tour_root/screenshots/fieldserv-jobs.png"
            "$route_tour_root/screenshots/fieldserv-job-detail.png"
            "$route_tour_root/screenshots/fieldserv-inspection.png"
            "$route_tour_root/screenshots/fieldserv-capture-handoff.png"
            "$route_tour_root/screenshots/fieldserv-evidence-review.png"
            "$route_tour_root/screenshots/learnloop-dashboard.png"
            "$route_tour_root/screenshots/learnloop-course.png"
            "$route_tour_root/screenshots/learnloop-subscription.png"
            "$route_tour_root/screenshots/learnloop-pack.png"
            "$route_tour_root/screenshots/learnloop-history-diagnostics.png"
            "$route_tour_root/screenshots/learnloop-route-tour.png"
            "$route_tour_root/screenshots/library.png"
            "$route_tour_root/screenshots/bridge-proof.png"
            "$route_tour_root/screenshots/offline-study-replayed.png"
            "$route_tour_root/screenshots/selective-native-claim-capture-unavailable.png"
          )
          for evidence_file in "${required_route_tour_files[@]}"; do
            test -s "$evidence_file"
          done
      - name: Validate route-tour evidence manifest
        run: |
          set -euo pipefail
          mix deps.get
          CROSSWAKE_EVIDENCE_MANIFEST_PATH=examples/phoenix_host/playwright-artifacts/route-tour/evidence-manifest.json \
            mix test test/crosswake/guides/evidence_manifest_test.exs
      - name: Capture web collateral via the harness (end-to-end rename proof)
        # Exercises bin/capture-collateral.sh --web-only against a live backend so
        # the Playwright→collateral rename mapping (library.png→web-home.png, etc.)
        # is proven, not just statically scanned. Starts the shared backend (the
        # same command Playwright's webServer uses) so the harness's curl pre-flight
        # passes; CI="" lets the harness's inner Playwright reuse that backend
        # instead of starting a second one on the same port.
        env:
          CI: ""
          CROSSWAKE_VERSION: ${{ steps.crosswake-version.outputs.version }}
        run: |
          set -euo pipefail
          ( cd examples/phoenix_host && \
            MIX_ENV=test mix do ecto.drop --quiet + ecto.create --quiet + ecto.migrate --quiet + phx.server ) &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4700/ >/dev/null 2>&1 && break
            sleep 2
          done
          bin/capture-collateral.sh --web-only
          test -s brandbook/collateral/see-it-run/web-home.png
          test -s brandbook/collateral/see-it-run/web-offline.png
          test -s brandbook/collateral/see-it-run/web-bridge-proof.png
      - name: Upload route-tour evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: crosswake-route-tour-evidence
          path: |
            examples/phoenix_host/playwright-artifacts/route-tour/evidence-manifest.json
            examples/phoenix_host/playwright-artifacts/route-tour/screenshots/
            examples/phoenix_host/playwright-report/
            examples/phoenix_host/test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Step summary
        run: |
          {
            echo "## Crosswake route-tour evidence"
            echo ""
            echo "Proven: semantic Playwright assertions covered v19 route ids before screenshots were captured."
            echo "Captured: evidence-manifest.json, generalized browser screenshots, Playwright HTML report, traces when Playwright produces them, and concise test output in crosswake-route-tour-evidence."
            echo "Advisory: screenshots are route-tour collateral and support reader inspection only."
            echo "Not claimed: native/device/provider/offline-mutation/commerce authority."
            echo "Retention: crosswake-route-tour-evidence is retained for 14 days."
          } >> "$GITHUB_STEP_SUMMARY"

  merge-blocking-offline-sync-e2e:      # THE ONLY required check (GATE-01 name)
    name: merge-blocking-offline-sync-e2e
    if: always()
    needs: [guard-01-e2e-honesty, guard-02-prod-route-absence, e2e-proof, route-tour-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Roll up guard results
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
