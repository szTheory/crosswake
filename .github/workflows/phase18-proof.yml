name: Phase 18 Proof

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase18-portable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Setup Android JVM toolchain
        uses: ./.github/actions/setup-android-jvm
        with:
          working-directory: packages/crosswake-shell-core-android

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Verify Phase 18 Elixir contract and proof slices
        run: bash script/verify_phase18_contract.sh

      - name: Verify generated local Android shell BridgeChannel proof
        timeout-minutes: 20
        run: |
          android_target="tmp/phase18-android-${GITHUB_RUN_ID}"
          rm -rf "${android_target}"
          mix crosswake.gen.shell android --target "${android_target}" --local
          export CROSSWAKE_ANDROID_PROJECT_ROOT="${android_target}/native/android/crosswake_shell"
          export CROSSWAKE_ANDROID_CONNECTED_TESTS="0"
          bash script/verify_generated_android_shell.sh

  phase18-proof:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify checked-in iOS shell bridge and activation proof
        env:
          CROSSWAKE_IOS_BUILD_FOR_TESTING: "0"
          CROSSWAKE_IOS_LAUNCH_SIMULATOR: "0"
          CROSSWAKE_IOS_USE_LOCAL_CORE: "1"
          CROSSWAKE_IOS_PROJECT_ROOT: examples/ios_shell_host
        run: bash script/verify_generated_ios_shell.sh
