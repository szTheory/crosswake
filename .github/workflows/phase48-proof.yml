name: Phase 48 Proof

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      lane:
        description: "Proof lane to run"
        required: true
        default: merge-blocking
        type: choice
        options:
          - merge-blocking
          - advisory
          - all
  schedule:
    - cron: "0 6 * * 1"

jobs:
  merge-blocking-provider-adapter-proof:
    name: merge-blocking provider adapter proof (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'merge-blocking' || inputs.lane == 'all')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup BEAM
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run hermetic Phase 48 provider adapter proof
        run: mix test test/crosswake/proof/phase48_provider_adapter_proof_test.exs

  advisory-provider-sandbox-proof:
    name: advisory provider sandbox/device proof (storekit + play billing)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'advisory' || inputs.lane == 'all')) }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup BEAM
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Advisory StoreKit sandbox/device checks
        env:
          CROSSWAKE_STOREKIT_SANDBOX_READY: ${{ secrets.CROSSWAKE_STOREKIT_SANDBOX_READY }}
        run: |
          if [ -z "${CROSSWAKE_STOREKIT_SANDBOX_READY}" ]; then
            echo "::notice title=Advisory StoreKit::credentials missing; skipping non-blocking StoreKit sandbox/device checks."
            exit 0
          fi
          echo "::notice title=Advisory StoreKit::credentials present; run host-specific StoreKit sandbox/device script here."

      - name: Advisory Play Billing sandbox/device checks
        env:
          CROSSWAKE_PLAY_BILLING_SANDBOX_READY: ${{ secrets.CROSSWAKE_PLAY_BILLING_SANDBOX_READY }}
        run: |
          if [ -z "${CROSSWAKE_PLAY_BILLING_SANDBOX_READY}" ]; then
            echo "::notice title=Advisory Play Billing::credentials missing; skipping non-blocking Play Billing sandbox/device checks."
            exit 0
          fi
          echo "::notice title=Advisory Play Billing::credentials present; run host-specific Play Billing sandbox/device script here."

      - name: Advisory lane status summary
        run: |
          echo "::notice title=Advisory lane::Provider sandbox/device checks are advisory only."
          echo "::notice::This job never gates merge and passing runs do not auto-promote support posture."
