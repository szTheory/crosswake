# Applies only the reviewed, immutable 0.2.3 iOS mirror tag repair after it is
# present on protected main. The script contains the complete transaction pin.
name: iOS mirror exact tag recovery

on:
  push:
    branches: [main]
    paths:
      - 'script/release_candidate/ios_tag_recovery.sh'
      - '.github/workflows/ios-tag-recovery.yml'

permissions:
  contents: read

jobs:
  repair-approved-ios-tag:
    name: Repair exact approved iOS mirror tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact approved transaction without credentials
        run: bash script/release_candidate/ios_tag_recovery.sh validate
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_DEPLOY_KEY }}
      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      - name: Create only the immutable v0.2.3 tag
        run: bash script/release_candidate/ios_tag_recovery.sh apply
