name: Phase 58 Advisory Proof

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  advisory-auth-provider-device-proof:
    name: advisory auth provider/device proof (non-promoting)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Report advisory posture
        run: |
          echo "Phase 58 advisory lane only."
          echo "Provider/device OAuth, passkey, verified-link, native auth UI, refresh-token, and shell/WebView token-authority proof are not merge-blocking support claims."
