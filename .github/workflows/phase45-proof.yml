name: Phase 45 Advisory Proof

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  advisory-rindle-proof:
    name: advisory rindle proof (dep present, validate_dependency :ok)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"
      - name: Install Elixir dependencies (with rindle)
        run: mix deps.get
        env:
          MIX_INCLUDE_RINDLE: "1"
      - name: Compile (with rindle, warnings as errors)
        run: mix compile --warnings-as-errors
        env:
          MIX_INCLUDE_RINDLE: "1"
      - name: Run advisory rindle proof (validate_dependency :ok)
        run: mix test test/crosswake/proof/phase45_rindle_advisory_test.exs
        env:
          MIX_INCLUDE_RINDLE: "1"
      - name: Advisory lane status summary
        run: |
          echo "::notice title=Advisory lane::This lane is advisory only and"
          echo "::notice::cannot gate merge. Failures here do NOT retract any"
          echo "::notice::merge-blocking rindle companion claim. Promotion to"
          echo "::notice::merge-blocking requires explicit requirement/roadmap"
          echo "::notice::scope change plus sustained stability evidence."
