name: See It Run Native

# Manual-only simulator/emulator capture, split out of See It Run Collateral so the
# web-and-gif run completes without waiting on a macOS job. The steps are unchanged
# from the former `native` job; the montage step is added here as its own artifact.
#
# Honest by construction: the native shells render the SAME Phoenix routes in a
# webview, so the screenshots are simulator/emulator evidence (advisory, not
# physical device) — exactly what the collateral label table claims.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: see-it-run-native
  cancel-in-progress: false

jobs:
  native:
    name: native
    runs-on: macos-latest
    # Hard cap: Android-emulator boot on macOS runners (no hardware accel) can hang
    # indefinitely. Without this the job inherits the 6-hour default and a stuck
    # emulator burns a runner for hours. Fail fast so the advisory capture never blocks.
    timeout-minutes: 35
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Boot shared backend on :4700 (detached)
        # iOS Simulator reaches it at localhost:4700; Android Emulator at 10.0.2.2:4700.
        # The native shells must load a real route, not a connection-error page.
        run: |
          set -euo pipefail
          cd examples/phoenix_host && mix deps.get && cd "$GITHUB_WORKSPACE"
          nohup bash -c 'cd examples/phoenix_host && \
            MIX_ENV=test mix do ecto.drop --quiet + ecto.create --quiet + ecto.migrate --quiet + phx.server' \
            >/tmp/phx-server.log 2>&1 &
          echo $! > /tmp/phx-server.pid
          for _ in $(seq 1 90); do
            curl -sf http://localhost:4700/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://localhost:4700/ >/dev/null 2>&1 || { echo "::error::backend never came up"; cat /tmp/phx-server.log; exit 1; }
      - name: Capture iOS simulator + Android emulator screenshots
        # KNOWN GAP (discovered 2026-06-23 by running this locally — see
        # .planning/v15.0-MILESTONE-AUDIT.md "Native capture findings"):
        #   1. capture-native-collateral.mjs drives the verify scripts' PROD
        #      scheme/flavor (CrosswakeShell / connected prod tests), NOT the
        #      Phase-126 Dev variants (iOS `-scheme Dev -configuration Debug-Dev`,
        #      Android `installDevDebug`) that point at localhost:4700 / 10.0.2.2.
        #      It must be taught to build the Dev variants or it screenshots the
        #      wrong (example.crosswake.invalid) shell.
        #   2. The iOS Dev scheme does not BUILD on Xcode 26: "Multiple commands
        #      produce route_activation.json" (prod Resources copy + the Dev
        #      Run-Script copy collide). The .pbxproj must resolve the duplicate
        #      producer before any honest iOS capture (local or CI) can succeed.
        # Until both are fixed this step will (correctly) fail the assert below
        # rather than commit a misleading screenshot.
        run: |
          node script/capture-native-collateral.mjs \
            --platform all \
            --output-dir native-collateral-artifacts \
            --screenshot-dir brandbook/collateral/see-it-run
      - name: Assert native screenshots captured (not unavailable)
        run: |
          set -euo pipefail
          test -s brandbook/collateral/see-it-run/ios-simulator.png
          test -s brandbook/collateral/see-it-run/android-emulator.png
          # Fail loudly if either platform reported "unavailable" in the manifest.
          if grep -q '"status": "unavailable"' native-collateral-artifacts/evidence-manifest.json; then
            echo "::error::a native platform reported unavailable — see manifest"
            cat native-collateral-artifacts/evidence-manifest.json
            exit 1
          fi
      - name: Stop backend
        if: always()
        run: kill "$(cat /tmp/phx-server.pid)" 2>/dev/null || true
      - name: Upload native artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: see-it-run-native
          path: |
            brandbook/collateral/see-it-run/ios-simulator.png
            brandbook/collateral/see-it-run/android-emulator.png
            native-collateral-artifacts/evidence-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Compose native montage (iOS + Android)
        run: |
          set -euo pipefail
          brew install imagemagick
          cd brandbook/collateral/see-it-run
          magick ios-simulator.png android-emulator.png +append native-montage.png
      - name: Upload montage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: see-it-run-montage
          path: brandbook/collateral/see-it-run/native-montage.png
          if-no-files-found: error
          retention-days: 14
