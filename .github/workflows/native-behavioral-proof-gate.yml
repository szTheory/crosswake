name: Native Behavioral Proof Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
# Purpose-named per domain (D-07) — NOT folded into contract-drift-gate.yml.
# Enforces Android JVM behavioral tests as merge-blocking and Swift tests as advisory;
# rolls up to one alls-green aggregator that is the SOLE new required check.
#
# TOPOLOGY:
#   android-package-unit  — ubuntu-latest, ./gradlew test, MERGE-BLOCKING
#                           (JVM-only, no emulator; hermetic per the project split)
#   ios-package-unit      — macos-latest, swift test, ADVISORY
#                           (macOS Xcode native toolchain → advisory per the locked project
#                            split; overrides NATIVE-TESTING.md §10 which incorrectly wanted
#                            iOS merge-blocking — the roadmap and D-07 are authoritative)
#   merge-blocking-native-behavioral-proof  — re-actors/alls-green aggregator;
#                           needs: ONLY android-package-unit (iOS is NOT in needs:);
#                           this aggregator name is the SOLE new required status check.
#
# REGISTRATION (run out-of-band by maintainer after this workflow goes green on main):
#
#   Ordering — must follow this sequence to avoid "Expected — Waiting for status" deadlock:
#     1. Merge this PR (native-behavioral-proof-gate.yml with aggregator topology).
#     2. Let merge-blocking-native-behavioral-proof go GREEN on main at least once.
#     3. Run the registration script (step 3 is harness-blocked; maintainer only):
#
#        script/register-native-gate.sh
#
#        Equivalent gh api one-liner (for reference / auditing):
#          EP="repos/szTheory/crosswake/branches/main/protection/required_status_checks"
#          current="$(gh api "$EP")"
#          desired="$(jq -n --argjson cur "$current" --arg new "merge-blocking-native-behavioral-proof" \
#            --argjson app 15368 \
#            '{ strict: $cur.strict,
#               checks: (($cur.checks // []) + [{context:$new, app_id:$app}] | unique_by(.context)) }')"
#          gh api -X PATCH "$EP" --input <(echo "$desired")
#
#   The granular required_status_checks endpoint is used — not the full PUT .../protection —
#   so enforce_admins and review requirements are left untouched.
#   The aggregator (merge-blocking-native-behavioral-proof) is the SOLE new required check;
#   the iOS advisory lane (ios-package-unit) is NOT registered as required.
#
# NTEST-04 / Phase 123

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  android-package-unit:                    # MERGE-BLOCKING: JVM tests, no emulator (D-07)
    name: android-package-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: packages/crosswake-shell-core-android/.gradle
          key: gradle-${{ hashFiles('packages/crosswake-shell-core-android/build.gradle.kts') }}
      - name: Run Android JVM tests
        working-directory: packages/crosswake-shell-core-android
        run: ./gradlew test
      - name: Step summary
        run: |
          echo "android-package-unit: Android JVM behavioral proof passed (merge-blocking)" >> "$GITHUB_STEP_SUMMARY"

  ios-package-unit:                        # ADVISORY: macOS Xcode native toolchain — NOT in aggregator needs (D-07)
    name: ios-package-unit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: packages/crosswake-shell-core-ios/.build
          key: spm-${{ hashFiles('packages/crosswake-shell-core-ios/Package.swift') }}
      - name: Run Swift tests
        working-directory: packages/crosswake-shell-core-ios
        run: swift test
      - name: Step summary
        run: |
          echo "ios-package-unit: Swift behavioral proof passed (advisory — not merge-blocking)" >> "$GITHUB_STEP_SUMMARY"

  android-generated-shell-unit:            # NEW — hermetic JVM generated-shell proof (D-17, LIFE-01a)
    name: android-generated-shell-unit
    runs-on: macos-latest                  # REVIEW FIX finding 2: verify script is mac-specific (arch() exit-1s off-mac)
    env:
      CROSSWAKE_ANDROID_CONNECTED_TESTS: "0"  # hermetic JVM-only; bypasses emulator branches (script line 9)
      CROSSWAKE_ANDROID_USE_MAVEN_LOCAL: "1"  # resolve shell-core from ~/.m2 (see publishToMavenLocal step) so a
                                              # version-bump release PR builds against the not-yet-published version
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          elixir-version: "1.19.5"        # project standard (phase73-proof.yml)
          otp-version: "27.3"             # project standard (phase73-proof.yml)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'              # satisfies JAVA_HOME check in verify script
      - name: Install Elixir dependencies   # the verify script runs `mix crosswake.gen.shell`; a fresh
        run: mix deps.get                    # checkout has no deps → "Can't continue due to errors on dependencies"
      - name: Publish shell-core to local Maven (~/.m2) for hermetic resolution
        working-directory: packages/crosswake-shell-core-android
        # The generated shell references the CURRENT-version published coordinate
        # (io.github.sztheory:crosswake-shell-core-android:<version>). On a version-bump
        # release PR that version isn't on Maven Central yet, so publish it to ~/.m2 first;
        # skip signing (no keys in CI, local publish is never uploaded).
        run: ./gradlew publishToMavenLocal --no-daemon -PcrosswakeSkipSigning=true
      - name: Run hermetic Android generated-shell verification
        run: script/verify_generated_android_shell.sh
      - name: Step summary
        run: |
          echo "android-generated-shell-unit: generated Android shell JVM proof passed (merge-blocking via aggregator)" >> "$GITHUB_STEP_SUMMARY"

  merge-blocking-native-behavioral-proof:  # THE ONLY new required check (NTEST-04 / D-07)
    name: merge-blocking-native-behavioral-proof
    if: always()
    needs: [android-package-unit, android-generated-shell-unit]  # D-18: both jobs feed the aggregator
    runs-on: ubuntu-latest
    steps:
      - name: Roll up native behavioral proof results
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
