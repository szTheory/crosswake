name: Phase 72 Proof

permissions:
  # permissions: contents: read
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      lane:
        description: "Proof lane to run"
        required: true
        default: merge-blocking
        type: choice
        options:
          - merge-blocking
          - advisory
          - all
  schedule:
    - cron: "0 6 * * 1"

env:
  DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer

jobs:
  merge-blocking-media-evidence-workflow-proof:
    name: merge-blocking media/evidence workflow proof (hermetic)
    runs-on: macos-15
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'merge-blocking' || inputs.lane == 'all')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup BEAM
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run hermetic Phase 72 media/evidence workflow proof
        run: mix test test/crosswake/proof/phase72_media_evidence_workflow_proof_test.exs

  advisory-storage-native-device-proof:
    name: advisory storage/native/device proof (non-promoting)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'advisory' || inputs.lane == 'all')) }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Advisory media/evidence notice
        run: |
          echo "::notice title=Advisory media lane::Real storage providers are advisory/deferred and never gate merge."
          echo "::notice title=Advisory media lane::Native camera/media picker capture, background transfer, and simulator/device behavior are advisory/deferred."
          echo "::notice title=Advisory media lane::Real network toggling and generic local mutation sync are advisory/deferred and never promote Phase 72 support posture."
