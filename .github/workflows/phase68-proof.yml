name: Phase 68 Android Emulator Advisory Proof

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-emulator-advisory:
    name: Advisory Android Emulator Lane
    # ubuntu-latest, not macos-15: this lane boots an `arch: x86_64` AVD. macos-15
    # runners are arm64, so an x86_64 image there falls back to full CPU emulation;
    # on ubuntu it runs on KVM, which is the path android-emulator-runner documents.
    # Nothing in this job touches an Apple toolchain (Phase 153.1 RUNNER-01 audit).
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # android-emulator-runner needs /dev/kvm readable by the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Document Promotion Criteria
        run: |
          echo "This is an advisory lane to track progress from jvm_hermetic to device_verified."
          echo "It runs non-blocking (continue-on-error) to alert on device regressions without blocking merges."

      - name: Run Emulator Advisory Proof
        # MUST be continue-on-error per AVER-03
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            echo "Advisory emulator booted successfully."
            # In a real scenario we might run: cd examples/android_shell_host && ./gradlew connectedCheck
