name: Phase 69 v4.0 Closeout Proof

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  merge-blocking-closeout-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile and check warnings
        run: mix compile --warnings-as-errors

      - name: Run Milestone Closeout Verification
        run: mix closeout.verify --cwd . --closeout-path .planning/milestones/v4.0-CLOSEOUT.md

      - name: Run Parity Tests
        run: mix test test/crosswake/proof/phase69_docs_contract_parity_test.exs test/mix/tasks/closeout_verify_test.exs
