name: Phase 5 Proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase5-proof:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Verify checked-in example hosts
        env:
          CROSSWAKE_PHASE5_NATIVE_PROOFS: "0"
        run: bash script/verify_phase5_example_hosts.sh
