name: "Brandbook Verify"

# Brand-asset quality gates (D-08, COLL-04). Triggers on brandbook/** changes.
#
# HYBRID GATE (promoted from advisory at v9.0 — see .planning/REQUIREMENTS.md):
#   • brand-structural — REQUIRED merge gate. Deterministic file / DOM / dimension /
#     token assertions with negligible flake risk. Add this job's check context to
#     branch-protection required-status-checks.
#   • brand-visual — ADVISORY (continue-on-error). Headless render + pixel-sample
#     checks; non-deterministic enough (fonts, network) to stay informational only.
#     Must NOT be added to required-status-checks.
#
# This replaces the manual brand UAT: every brandbook change is verified here
# instead of by human checkpoint.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "brandbook/**"
      - "examples/phoenix_host/priv/static/css/app.css"
      - "priv/static/crosswake/**"
      - "priv/templates/crosswake/offline_ui/**"
      - "examples/phoenix_host/lib/crosswake_example_web/controllers/offline_html/**"
  push:
    paths:
      - "brandbook/**"
      - "examples/phoenix_host/priv/static/css/app.css"
      - "priv/static/crosswake/**"
      - "priv/templates/crosswake/offline_ui/**"
      - "examples/phoenix_host/lib/crosswake_example_web/controllers/offline_html/**"

jobs:
  brand-structural:
    name: brand-structural
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      - name: Install brandbook tool dependencies
        working-directory: brandbook/tools
        run: npm ci

      - name: Size budget (committed brandbook <= 1MB)
        run: |
          TOTAL=$(git ls-files brandbook | xargs -I{} stat -c%s {} | awk '{s+=$1} END{print s+0}')
          echo "Committed brandbook bytes: $TOTAL"
          if [ "$TOTAL" -gt 1048576 ]; then
            echo "ERROR: brandbook exceeds 1MB budget ($TOTAL bytes > 1048576)"
            exit 1
          fi
          echo "Size budget OK ($TOTAL / 1048576 bytes)"

      - name: SVG structural validation - production marks
        working-directory: brandbook/tools
        run: node check-production.mjs

      - name: SVG structural validation - candidate marks
        working-directory: brandbook/tools
        run: node check-candidates.mjs

      - name: Token JSON round-trip
        working-directory: brandbook/tools
        run: node --test compile-tokens.test.mjs

      - name: WCAG contrast matrix
        working-directory: brandbook/tools
        run: node --test contrast.test.mjs

      - name: Consumer drift gate (no hex / no primitives / semantic coverage)
        working-directory: brandbook/tools
        run: node check-consumer-drift.mjs

      - name: Install brand e2e dependencies
        working-directory: brandbook/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: brandbook/e2e
        run: npx playwright install --with-deps chromium

      - name: Structural brand checks (DOM, dimensions, source assertions)
        working-directory: brandbook/e2e
        run: npm run test:structural

  brand-visual:
    name: brand-visual
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # ADVISORY: failures here never gate a merge.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      - name: Install brand e2e dependencies
        working-directory: brandbook/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: brandbook/e2e
        run: npx playwright install --with-deps chromium

      - name: Visual render + pixel-sample checks
        working-directory: brandbook/e2e
        run: npm run test:visual

      - name: README header raw-URL verification (main only — needs merged assets)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node brandbook/tools/check-readme-urls.mjs

      - name: Advisory lane notice
        if: always()
        run: |
          echo "::notice title=Advisory lane::brand-visual is advisory only — failures here do NOT gate merge."
