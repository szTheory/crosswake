name: Phase 74 Proof

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Proof lane to run"
        required: true
        default: merge-blocking
        type: choice
        options:
          - merge-blocking
          - advisory
          - all
  schedule:
    - cron: "0 6 * * 1"

jobs:
  advisory-offline-draft-recovery-proof:
    name: advisory offline draft recovery proof (non-promoting)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'advisory' || inputs.lane == 'all')) }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup BEAM
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3"

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run hermetic Phase 74 offline draft recovery proof
        run: mix test test/crosswake/proof/phase74_offline_draft_recovery_proof_test.exs
