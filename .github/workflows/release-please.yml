        # fail-closed :error path stays proven in core).
        run: >
          bash script/verify_companion_cleanroom.sh
          crosswake_rindle
          "${{ needs.release-please.outputs.rindle_version }}"
          rindle
          Rindle

  clean-room-proof-sigra:
    name: Clean-room proof — crosswake_sigra resolvability + doctor
    # D-15 / PROOF-02: clean-room runs ONLY after the publish job, enforcing the SC#4 ordering.
    # `needs: publish-hex-sigra` is the structural guarantee — this job cannot run before the
    # dry-run-gated companion publish completes.
    needs: [release-please, publish-hex-sigra]
    # D-8 / D-07: gate on the per-component output, not the aggregate `releases_created`.
    if: ${{ needs.release-please.outputs.sigra_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Run clean-room proof (D-16 / T-137-16 — logic lives in script; YAML stays thin)
        # Invokes script/verify_companion_cleanroom.sh in no-engine mode (sigra has no engine dep
        # — pure-Elixir auth machinery; validate_dependency/0 returns :ok unconditionally).
        # Owns: Hex propagation poll, throwaway Phoenix host build (in $RUNNER_TEMP), dep install,
        # compile, public-seam smoke test, and mix crosswake.doctor --router assertion (PROOF-01/02).
        run: >
          bash script/verify_companion_cleanroom.sh
          crosswake_sigra
          "${{ needs.release-please.outputs.sigra_version }}"

  clean-room-proof-chimeway:
    name: Clean-room proof — crosswake_chimeway resolvability + doctor
    # D-15 / PROOF-02: clean-room runs ONLY after the publish job, enforcing the SC#4 ordering.
    # `needs: publish-hex-chimeway` is the structural guarantee — this job cannot run before the
    # dry-run-gated companion publish completes.
    needs: [release-please, publish-hex-chimeway]
    # D-8 / D-07: gate on the per-component output, not the aggregate `releases_created`.
    if: ${{ needs.release-please.outputs.chimeway_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Run clean-room proof (D-16 / T-138-10 — logic lives in script; YAML stays thin)
        # Invokes script/verify_companion_cleanroom.sh in no-engine mode (chimeway has no engine dep
        # — pure-Elixir notification companion; validate_dependency/0 returns :ok unconditionally).
        # No ENGINE_PACKAGE arg → no-engine mode: installs crosswake + crosswake_chimeway only,
        # NOT crosswake_sigra (CHIME-02 no-sigra-dep invariant enforced at the CI level).
        # The chimeway-specific smoke test emits assert enabled?(%{}) (defaults true) and
        # the Chimeway.Telemetry.event_names/0 == 10 canary (vacuity-safe — T-138-11).
        # Owns: Hex propagation poll, throwaway Phoenix host build (in $RUNNER_TEMP), dep install,
        # compile, public-seam smoke test (chimeway-correct), and mix crosswake.doctor --router.
        run: >
          bash script/verify_companion_cleanroom.sh
          crosswake_chimeway
          "${{ needs.release-please.outputs.chimeway_version }}"

  clean-room-proof-threadline:
    name: Clean-room proof — crosswake_threadline module-shipment + zero-sibling-dep
    # D-15 / PROOF-02: clean-room runs ONLY after the publish job, enforcing the SC#4 ordering.
    # `needs: publish-hex-threadline` is the structural guarantee — this job cannot run before the
    # dry-run-gated observer publish completes.
    needs: [release-please, publish-hex-threadline]
    # D-8 / D-07: gate on the per-component output, not the aggregate `releases_created`.
    if: ${{ needs.release-please.outputs.threadline_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Run clean-room proof (D-16 / T-139-11 — logic lives in script; YAML stays thin)
        # Invokes script/verify_companion_cleanroom.sh in no-engine non-companion mode.
        # crosswake_threadline is NOT a Crosswake.Companion implementor — companion-behaviour
        # assertions (enabled?/1, companion_id/0, validate_dependency/0) are SUPPRESSED by
        # the threadline canary branch in the script (T-139-11).
        # No ENGINE_PACKAGE arg → no-engine mode: installs crosswake + crosswake_threadline ONLY.
        # Neither crosswake_sigra nor crosswake_chimeway is installed (T-139-18 zero-sibling-dep).
        # Three module-shipment canaries prove real threadline machinery shipped:
        # Telemetry.event_names/0 == 3, Plug.Threadline.init/1 header_name, Ledger.actor_ref/2 hex.
        # Owns: Hex propagation poll, throwaway Phoenix host build (in $RUNNER_TEMP), dep install,
        # compile, module-shipment smoke test (vacuity-safe, threadline-correct), and doctor check.
        run: >
          bash script/verify_companion_cleanroom.sh
          crosswake_threadline
          "${{ needs.release-please.outputs.threadline_version }}"

  release-as-cleanup:
    name: Strip stale release-as after companion release (PROOF-03b)
    # Runs when ANY companion cut a release this run. The one-shot `release-as` bootstrap pin is
    # stale the moment its release tag exists — left in place it re-targets the same version forever
    # (recipe Step 12f / Pitfall 6). This job strips it and opens a cleanup PR automatically, so the
    # only human action is merging a one-line, guard-verified PR (main is protected). The
    # release-as-staleness gate stays RED until that PR merges, so it cannot be silently skipped.
    needs:
      - release-please
      - publish-hex-rulestead
      - publish-hex-rindle
      - publish-hex-sigra
      - publish-hex-chimeway
      - publish-hex-threadline
      - clean-room-proof-rulestead
      - clean-room-proof-rindle
      - clean-room-proof-sigra
      - clean-room-proof-chimeway
      - clean-room-proof-threadline
    if: >-
      ${{
        always() &&
        (
          needs.release-please.outputs.rulestead_release_created == 'true' ||
          needs.release-please.outputs.rindle_release_created == 'true' ||
          needs.release-please.outputs.sigra_release_created == 'true' ||
          needs.release-please.outputs.chimeway_release_created == 'true' ||
          needs.release-please.outputs.threadline_release_created == 'true'
        ) &&
        (
          needs.release-please.outputs.rulestead_release_created != 'true' ||
          (
            needs.publish-hex-rulestead.result == 'success' &&
            needs.clean-room-proof-rulestead.result == 'success'
          )
        ) &&
        (
          needs.release-please.outputs.rindle_release_created != 'true' ||
          (
            needs.publish-hex-rindle.result == 'success' &&
            needs.clean-room-proof-rindle.result == 'success'
          )
        ) &&
        (
          needs.release-please.outputs.sigra_release_created != 'true' ||
          (
            needs.publish-hex-sigra.result == 'success' &&
            needs.clean-room-proof-sigra.result == 'success'
          )
        ) &&
        (
          needs.release-please.outputs.chimeway_release_created != 'true' ||
          (
            needs.publish-hex-chimeway.result == 'success' &&
            needs.clean-room-proof-chimeway.result == 'success'
          )
        ) &&
        (
          needs.release-please.outputs.threadline_release_created != 'true' ||
          (
            needs.publish-hex-threadline.result == 'success' &&
            needs.clean-room-proof-threadline.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Strip release-as for released companion(s) and open cleanup PR
        # RELEASE_PLEASE_TOKEN (a PAT) is preferred so required CI — incl. the staleness gate —
        # runs on the cleanup PR; github.token does not chain-trigger other workflows (file header).
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "${{ needs.release-please.outputs.rulestead_release_created }}" = "true" ]; then
            python3 script/strip_release_as.py crosswake_rulestead
          fi
          if [ "${{ needs.release-please.outputs.rindle_release_created }}" = "true" ]; then
            python3 script/strip_release_as.py crosswake_rindle
          fi
          if [ "${{ needs.release-please.outputs.sigra_release_created }}" = "true" ]; then
            python3 script/strip_release_as.py crosswake_sigra
          fi
          if [ "${{ needs.release-please.outputs.chimeway_release_created }}" = "true" ]; then
            python3 script/strip_release_as.py crosswake_chimeway
          fi
          if [ "${{ needs.release-please.outputs.threadline_release_created }}" = "true" ]; then
            python3 script/strip_release_as.py crosswake_threadline
          fi
          if [ -z "$(git status --porcelain release-please-config.json)" ]; then
            echo "[crosswake] No stale release-as pin to strip — nothing to do."
            exit 0
          fi
          branch="chore/release-as-cleanup-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add release-please-config.json
          git commit -m "chore(release): drop one-shot release-as pin after companion release (PROOF-03b)"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): drop stale release-as pin(s) after companion release" \
            --body "Auto-generated (PROOF-03b). A companion's first release tag now exists, so its one-shot \`release-as\` bootstrap pin is stale — left in place it re-targets the same version forever (Pitfall 6). This PR strips \`release-as\` (and any adjacent \`_TODO_release_as\`) from the released component block(s). The release-as-staleness gate stays RED until this merges; safe to merge once CI is green."

  release-failure-alert:
    name: Alert on companion or native publish/proof failure (PROOF-03c, D-15)
    # Fires ONLY when a downstream companion or native publish job, post-publish clean-room proof
    # job, or the native release rollup actually FAILED. Skipped jobs (no companion/native package
    # released this run) are not failures, so this stays dormant on the happy/no-release path — the
    # post-publish proof needs zero human eyeballing when green. A human is paged (via an
    # auto-opened issue) only when something is genuinely broken. D-15 extends this to the native
    # (iOS/Android) lanes: this is the only surface with persistence, and a mirror-push failure
    # previously opened NOTHING here — the exact gap that let a red release go unnoticed for ~3
    # months.
    needs:
      - publish-hex-rulestead
      - publish-hex-rindle
      - publish-hex-sigra
      - publish-hex-chimeway
      - clean-room-proof-rulestead
      - clean-room-proof-rindle
      - clean-room-proof-sigra
      - clean-room-proof-chimeway
      - publish-hex-threadline
      - clean-room-proof-threadline
      - publish-ios-core
      - clean-room-proof-ios
      - publish-android-core
      - clean-room-proof-android
      - native-release-rollup
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open tracking issue
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "A companion or native publish job, post-publish clean-room proof job, or the native release rollup failed on the Release Please workflow. This is not necessarily a companion failure — check the job results below."
            echo
            echo "- Run: ${run_url}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "Job results:"
            echo "- publish-hex-rulestead: ${{ needs.publish-hex-rulestead.result }}"
            echo "- publish-hex-rindle: ${{ needs.publish-hex-rindle.result }}"
            echo "- publish-hex-sigra: ${{ needs.publish-hex-sigra.result }}"
            echo "- publish-hex-chimeway: ${{ needs.publish-hex-chimeway.result }}"
            echo "- clean-room-proof-rulestead: ${{ needs.clean-room-proof-rulestead.result }}"
            echo "- clean-room-proof-rindle: ${{ needs.clean-room-proof-rindle.result }}"
            echo "- clean-room-proof-sigra: ${{ needs.clean-room-proof-sigra.result }}"
            echo "- clean-room-proof-chimeway: ${{ needs.clean-room-proof-chimeway.result }}"
            echo "- publish-hex-threadline: ${{ needs.publish-hex-threadline.result }}"
            echo "- clean-room-proof-threadline: ${{ needs.clean-room-proof-threadline.result }}"
            echo "- publish-ios-core: ${{ needs.publish-ios-core.result }}"
            echo "- clean-room-proof-ios: ${{ needs.clean-room-proof-ios.result }}"
            echo "- publish-android-core: ${{ needs.publish-android-core.result }}"
            echo "- clean-room-proof-android: ${{ needs.clean-room-proof-android.result }}"
            echo "- native-release-rollup: ${{ needs.native-release-rollup.result }}"
            echo
            echo "Opened automatically (PROOF-03c/D-15) so the post-publish proof needs no human eyeballing on the success path. Investigate the failed job above, then close."
          } > /tmp/release_alert_body.md
          gh issue create --repo "$REPO" \
            --title "[release] companion or native publish/clean-room proof failed — run ${{ github.run_id }}" \
            --body-file /tmp/release_alert_body.md
