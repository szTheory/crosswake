# Release Please opens/updates a Release PR from conventional commits on main.
# When that PR is merged, Release Please creates the GitHub Release + v* tag,
# then publish-hex runs the same test bar as CI and publishes to Hex with
# HEX_API_KEY.
#
# Requires repository secret: HEX_API_KEY (Actions secrets).
# RELEASE_PLEASE_TOKEN: optional fine-grained PAT. Using it for Release Please
# makes release-branch pushes and PRs run required CI (GITHUB_TOKEN does not
# chain-trigger other workflows). Also use if branch rules block the default token.

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      # Manifest mode (config-file + manifest-file) emits the PLURAL aggregate
      # `releases_created` — true if ANY package released. The singular top-level
      # `release_created` is NOT set in manifest mode, so gating on it silently
      # skips every publish job. With linked-versions all three packages release
      # together, so the aggregate is the correct gate (LOCK-02 / ROADMAP SC#5).
      releases_created: ${{ steps.release.outputs.releases_created }}
      # For the root package (path "."), release-please-action v4 writes per-path
      # outputs UNPREFIXED — so `tag_name`/`version` here are the Hex (root) values.
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4.1.3
        with:
          # Optional: set secret RELEASE_PLEASE_TOKEN (fine-grained PAT) if the
          # default token cannot open Release PRs; otherwise github.token suffices.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-hex:
    name: Publish to Hex.pm
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache library deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch library deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Verify release version in mix.exs
        run: grep -n "@version \"${{ needs.release-please.outputs.version }}\"" mix.exs

      - name: Run library tests
        # Exclude :requires_example_host — those proof tests (phase5/7/8/9/21)
        # need the checked-in example Phoenix app compiled and are gated on PRs
        # by phase5-proof.yml. A bare `mix test` here on a clean runner would
        # fail with CrosswakeExample.Router undefined and block the publish.
        env:
          MIX_ENV: test
        run: mix test --exclude requires_example_host

      - name: Dry run Hex publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --dry-run --yes

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Verify version on Hex.pm
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if curl -fsS "https://hex.pm/api/packages/crosswake/releases/${VERSION}" | grep -q "\"version\""; then
              echo "Hex.pm lists crosswake ${VERSION}"
              exit 0
            fi
            echo "waiting for Hex index... (${i}/36)"
            sleep 10
          done
          echo "Timed out waiting for https://hex.pm/api/packages/crosswake/releases/${VERSION}"
          exit 1

  publish-ios-core:
    name: Mirror iOS core to split repo
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install splitsh-lite v1.0.1
        run: |
          # v2.0.0 exists as a tag but ships NO release assets; only v1.0.x publish
          # lite_linux_amd64.tar.gz. Pinning v2.0.0 404'd and broke the iOS mirror.
          curl -fsSL https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz \
            | tar xz
          sudo mv splitsh-lite /usr/local/bin/splitsh-lite

      - name: Split subtree
        run: |
          SHA=$(splitsh-lite --prefix=packages/crosswake-shell-core-ios)
          echo "SPLIT_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Push split to mirror and tag
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          # SwiftPM resolves on a bare semver tag (e.g. v0.1.2). The release-please
          # root tag_name is component-prefixed (`hex-v0.1.2`) and would NOT resolve,
          # so the mirror tag is derived from the plain `version` output (PUB-01/SC#1).
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/szTheory/crosswake-shell-core-ios.git"
          git push mirror "${SPLIT_SHA}:refs/heads/main"
          git push mirror "${SPLIT_SHA}:refs/tags/v${VERSION}"

  publish-android-core:
    name: Publish Android core to Maven Central
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish to Maven Central
        working-directory: packages/crosswake-shell-core-android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        # -PcrosswakeAutomaticRelease=true: upload AND auto-publish to Maven Central
        # once validated, so the downstream clean-room proof can resolve 0.1.2.
        run: ./gradlew publishToMavenCentral --no-daemon -PcrosswakeAutomaticRelease=true

  clean-room-proof-ios:
    name: Clean-room proof — iOS swift build
    needs: [release-please, publish-hex, publish-ios-core, publish-android-core]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install crosswake archive at just-cut version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: mix archive.install hex crosswake "$VERSION" --force

      - name: Generate iOS shell outside monorepo
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/clean-room-proof-ios"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          mix crosswake.gen.shell ios --target "$TARGET"

      - name: swift build with mirror tag retry
        run: |
          set -euo pipefail
          PROJECT_ROOT="$RUNNER_TEMP/clean-room-proof-ios/native/ios/crosswake_shell"
          cd "$PROJECT_ROOT"

          for i in 1 2 3; do
            if swift build; then
              echo "swift build succeeded on attempt $i"
              exit 0
            fi

            echo "swift build attempt $i/3 failed; retrying in 30s for mirror tag availability..."
            sleep 30
          done

          echo "swift build failed after 3 attempts."
          exit 1

  clean-room-proof-android:
    name: Clean-room proof — Android gradle build
    needs: [release-please, publish-hex, publish-ios-core, publish-android-core]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install crosswake archive at just-cut version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: mix archive.install hex crosswake "$VERSION" --force

      - name: Generate Android shell outside monorepo
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/clean-room-proof-android"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          mix crosswake.gen.shell android --target "$TARGET"

      - name: gradle build with Maven Central propagation polling
        run: |
          set -euo pipefail
          PROJECT_ROOT="$RUNNER_TEMP/clean-room-proof-android/native/android/crosswake_shell"
          cd "$PROJECT_ROOT"
          chmod +x gradlew

          MAX_ATTEMPTS=40
          DELAY=45
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            if ./gradlew build --no-daemon; then
              echo "gradle build succeeded on attempt $i"
              exit 0
            fi

            echo "Attempt $i/$MAX_ATTEMPTS: gradle build failed; Maven Central may not have propagated. Retrying in ${DELAY}s..."
            sleep "$DELAY"
          done

          echo "gradle build failed after $MAX_ATTEMPTS attempts (~30 min). Maven Central propagation timeout."
          exit 1

  # Permanent dispatch-only fire-drill: proves the full Android publish path without burning a
  # version coordinate. Run this before every real release as a mandatory pre-publish rehearsal.
  # Preflight -> local-publish asserts -> validated-upload -> DROP (frees coordinate).
  android-publish-fire-drill:
    name: Android publish fire-drill (validated-upload -> drop)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preflight — assert required secrets are set
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          for var in \
            HEX_API_KEY \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey \
            ORG_GRADLE_PROJECT_signingInMemoryKeyId \
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword \
            MIRROR_PUSH_TOKEN \
            RELEASE_PLEASE_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "MISSING SECRET: $var"
              exit 1
            fi
          done
          echo "All 8 required secrets are set."

      - name: Local publish to ~/.m2 and assert artifacts
        working-directory: packages/crosswake-shell-core-android
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        run: |
          set -euo pipefail
          ./gradlew publishToMavenLocal --no-daemon

          VERSION=$(grep '// x-release-please-version' build.gradle.kts \
            | sed 's/.*version = "\(.*\)" \/\/.*/\1/')
          echo "Asserting artifacts for version: $VERSION"
          ARTIFACT_DIR="$HOME/.m2/repository/io/github/sztheory/crosswake-shell-core-android/$VERSION"

          # Maven classifier artifacts (sources/javadoc) use a HYPHEN before the
          # classifier (e.g. -0.1.0-sources.jar); main artifacts (aar/pom) use a
          # dot (e.g. -0.1.0.aar). The earlier `.${ext}` form looked for
          # `.sources.jar`/`.javadoc.jar`, which never exist.
          for artifact in \
            "crosswake-shell-core-android-${VERSION}.aar" \
            "crosswake-shell-core-android-${VERSION}-sources.jar" \
            "crosswake-shell-core-android-${VERSION}-javadoc.jar" \
            "crosswake-shell-core-android-${VERSION}.pom"; do
            ARTIFACT="$ARTIFACT_DIR/$artifact"
            if [ ! -f "$ARTIFACT" ]; then
              echo "MISSING ARTIFACT: $ARTIFACT"
              exit 1
            fi
            ASC="${ARTIFACT}.asc"
            if [ ! -f "$ASC" ]; then
              echo "MISSING SIGNATURE: $ASC"
              exit 1
            fi
            echo "OK: $(basename $ARTIFACT) + .asc"
          done

          POM="$ARTIFACT_DIR/crosswake-shell-core-android-${VERSION}.pom"
          for field in name description url license developers scm; do
            if ! grep -qi "<${field}" "$POM"; then
              echo "POM MISSING FIELD: $field"
              exit 1
            fi
          done
          echo "POM fields OK: name, description, url, license, developers, scm"

      - name: Central Portal validated-upload -> DROP
        working-directory: packages/crosswake-shell-core-android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          MAVEN_USERNAME: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          MAVEN_PASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
        run: |
          set -euo pipefail

          VERSION=$(grep '// x-release-please-version' build.gradle.kts \
            | sed 's/.*version = "\(.*\)" \/\/.*/\1/')

          # Assemble a Central Portal bundle from the local Maven repo and upload it via
          # the raw Publisher API. The API returns the deployment id, which we then poll
          # by id (POST /status?id=) and DROP. gradle's publishToMavenCentral never
          # surfaces the id and there is NO list-by-state endpoint, so the previous
          # `GET /deployments?state=` poll (also using Basic instead of Bearer auth)
          # could never find the deployment it had just created.
          ./gradlew publishToMavenLocal --no-daemon

          REPO="$HOME/.m2/repository"
          ART_PATH="io/github/sztheory/crosswake-shell-core-android/$VERSION"
          # Central requires md5 + sha1 alongside each artifact.
          ( cd "$REPO/$ART_PATH"
            for f in *; do
              case "$f" in *.md5|*.sha1) continue;; esac
              md5sum "$f" | cut -d' ' -f1 > "$f.md5"
              sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
            done )

          BUNDLE="$RUNNER_TEMP/central-bundle.zip"
          rm -f "$BUNDLE"
          ( cd "$REPO" && zip -qr "$BUNDLE" "$ART_PATH" )

          # Central Portal API auth is Bearer base64(user:pass) — NOT HTTP Basic.
          TOKEN=$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 | tr -d '\n')
          AUTH="Authorization: Bearer $TOKEN"

          echo "Uploading bundle to Central Portal (USER_MANAGED — stops at VALIDATED)..."
          DEPLOYMENT_ID=$(curl -fsS -X POST -H "$AUTH" \
            -F "bundle=@$BUNDLE" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=firedrill-${VERSION}&publishingType=USER_MANAGED")
          echo "Deployment ID: $DEPLOYMENT_ID"
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Upload did not return a deployment id."
            exit 1
          fi

          echo "Polling deployment status (up to 30 attempts, 15s interval)..."
          STATE=""
          for i in $(seq 1 30); do
            STATE=$(curl -fsS -X POST -H "$AUTH" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('deploymentState',''))")
            echo "Attempt $i/30: deploymentState=${STATE:-<none>}"
            case "$STATE" in
              VALIDATED) break;;
              FAILED) echo "Deployment FAILED — retaining for inspection (not dropping)."; exit 1;;
            esac
            sleep 15
          done

          if [ "$STATE" != "VALIDATED" ]; then
            echo "Timed out waiting for VALIDATED (last state: ${STATE:-none})."
            exit 1
          fi

          # DROP the VALIDATED deployment — frees the coordinate (immutability is scoped
          # to PUBLISHED only; VALIDATED deployments are safely droppable).
          echo "VALIDATED. Dropping deployment to free the coordinate..."
          curl -fsS -X DELETE -H "$AUTH" \
            "https://central.sonatype.com/api/v1/publisher/deployment/${DEPLOYMENT_ID}"
          echo "SUCCESS: Deployment $DEPLOYMENT_ID dropped. Version coordinate is FREE."

  # On-demand lockstep consistency assertion: confirms the three configured version coordinates
  # (mix.exs @version, build.gradle.kts version, .release-please-manifest.json) are internally
  # consistent. This is the D-05 110-equivalent of SC#4 — proves the lockstep CONFIG is correct
  # without requiring a live 0.1.2 artifact (that happens at Phase 111's real cut).
  lockstep-truth:
    name: Assert lockstep version coordinates match
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assert lockstep version coordinates match
        run: |
          set -euo pipefail

          # Extract mix.exs @version (x-release-please-version annotation)
          MIX_VERSION=$(grep '# x-release-please-version' mix.exs \
            | sed 's/.*@version "\(.*\)" # x-release-please-version.*/\1/')

          # Extract build.gradle.kts version (x-release-please-version annotation)
          GRADLE_VERSION=$(grep '// x-release-please-version' packages/crosswake-shell-core-android/build.gradle.kts \
            | sed 's/.*version = "\(.*\)" \/\/.*/\1/')

          # Extract manifest baselines (. and packages/crosswake-shell-core-android)
          MANIFEST_ROOT=$(python3 -c "import json; d=json.load(open('.release-please-manifest.json')); print(d['.'])")
          MANIFEST_ANDROID=$(python3 -c "import json; d=json.load(open('.release-please-manifest.json')); print(d['packages/crosswake-shell-core-android'])")

          echo "mix.exs @version:               $MIX_VERSION"
          echo "build.gradle.kts version:       $GRADLE_VERSION"
          echo "manifest . baseline:            $MANIFEST_ROOT"
          echo "manifest android baseline:      $MANIFEST_ANDROID"

          # All four must be equal for internal lockstep consistency
          if [ "$MIX_VERSION" != "$GRADLE_VERSION" ] || \
             [ "$MIX_VERSION" != "$MANIFEST_ROOT" ] || \
             [ "$MIX_VERSION" != "$MANIFEST_ANDROID" ]; then
            echo "LOCKSTEP MISMATCH:"
            echo "  mix.exs @version:             $MIX_VERSION"
            echo "  build.gradle.kts version:     $GRADLE_VERSION"
            echo "  manifest . baseline:          $MANIFEST_ROOT"
            echo "  manifest android baseline:    $MANIFEST_ANDROID"
            exit 1
          fi

          echo "LOCKSTEP OK: all coordinates agree on version $MIX_VERSION"
