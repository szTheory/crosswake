# Release Please opens/updates a Release PR from conventional commits on main.
# When that PR is merged, Release Please creates the GitHub Release + v* tag,
# then publish-hex runs the same test bar as CI and publishes to Hex with
# HEX_API_KEY.
#
# Requires repository secret: HEX_API_KEY (Actions secrets).
# RELEASE_PLEASE_TOKEN: optional fine-grained PAT. Using it for Release Please
# makes release-branch pushes and PRs run required CI (GITHUB_TOKEN does not
# chain-trigger other workflows). Also use if branch rules block the default token.

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  approved-release-guard:
    name: "release: approved-candidate merge guard"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      linked_release: ${{ steps.guard.outputs.linked_release }}
      approved_head: ${{ steps.guard.outputs.approved_head }}
      approved_tree: ${{ steps.guard.outputs.approved_tree }}
      merge_oid: ${{ steps.guard.outputs.merge_oid }}
      base_oid: ${{ steps.guard.outputs.base_oid }}
      merge_parents: ${{ steps.guard.outputs.merge_parents }}
      merge_tree: ${{ steps.guard.outputs.merge_tree }}
      candidate_receipt: ${{ steps.guard.outputs.candidate_receipt }}
      candidate_run_id: ${{ steps.guard.outputs.candidate_run_id }}
      candidate_receipt_run_id: ${{ steps.guard.outputs.candidate_receipt_run_id }}
      approved_version: ${{ steps.guard.outputs.approved_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require approved head parentage, identical tree, and exact receipt
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          emit_output() { printf '%s\n' "$1" >> "$GITHUB_OUTPUT"; }
          emit_output "linked_release=false"

          # Proposal-refresh pushes remain reversible. The strict gate activates only
          # for the merge that changes all three linked coordinates to 0.2.1.
          parent_line=$(git rev-list --parents -n 1 "$RUN_HEAD")
          parent_count=$(printf '%s\n' "$parent_line" | awk '{print NF}')
          [ "$parent_count" -ge 2 ] || exit 0
          first_parent=$(printf '%s\n' "$parent_line" | awk '{print $2}')
          linked_delta=$(git diff --name-only "$first_parent" "$RUN_HEAD" -- \
            mix.exs .release-please-manifest.json \
            packages/crosswake-shell-core-android/build.gradle.kts | wc -l | tr -d ' ')
          [ "$linked_delta" -eq 3 ] || exit 0
          manifest_version=$(jq -er '."."' .release-please-manifest.json)
          linked_candidate=false
          if grep -q "@version \"${manifest_version}\"" mix.exs &&
            grep -q "version = \"${manifest_version}\"" packages/crosswake-shell-core-android/build.gradle.kts &&
            jq -e --arg v "$manifest_version" \
              '."." == $v and ."packages/crosswake-shell-core-ios" == $v and ."packages/crosswake-shell-core-android" == $v' \
              .release-please-manifest.json >/dev/null; then
            linked_candidate=true
          fi
          [ "$linked_candidate" = "true" ] || exit 0

          # A linked release must be a two-parent merge. The approved Release Please
          # head is the second parent; its tree must be byte-identical to the merge.
          [ "$parent_count" -eq 3 ]
          merge_oid=$(printf '%s\n' "$parent_line" | awk '{print $1}')
          second_parent=$(printf '%s\n' "$parent_line" | awk '{print $3}')
          approved_head="$second_parent"
          approved_tree=$(git rev-parse "${approved_head}^{tree}")
          merge_tree=$(git rev-parse "${merge_oid}^{tree}")
          [ "$approved_head" = "$second_parent" ]
          [ "$merge_tree" = "$approved_tree" ]

          # Crosswake CI owns credential-free candidate proof; the trusted iOS
          # workflow separately attests the canonical READY receipt against CI,
          # Hex, iOS, and live zero-mutation evidence. Require one unexpired exact-head
          # attestation artifact, then independently bind its referenced CI run.
          artifact_name="phase168-candidate-receipt-${approved_head}"
          artifact_index=$(gh api -X GET "repos/$REPOSITORY/actions/artifacts" \
            -f name="$artifact_name" -f per_page=100)
          [ "$(printf '%s' "$artifact_index" | jq '[.artifacts[] | select(.expired == false)] | length')" -eq 1 ]
          candidate_receipt_run_id=$(printf '%s' "$artifact_index" | jq -er \
            '[.artifacts[] | select(.expired == false)] | first | .workflow_run.id')
          receipt_run=$(gh run view "$candidate_receipt_run_id" --repo "$REPOSITORY" \
            --json conclusion,event,workflowName)
          printf '%s' "$receipt_run" | jq -e \
            '.conclusion == "success" and .event == "workflow_dispatch" and .workflowName == "iOS mirror authority"' >/dev/null

          receipt_dir="$RUNNER_TEMP/approved-candidate-receipt"
          mkdir -p "$receipt_dir"
          gh run download "$candidate_receipt_run_id" --repo "$REPOSITORY" \
            --name "$artifact_name" --dir "$receipt_dir"
          receipt="$receipt_dir/candidate-receipt.json"
          test -f "$receipt"
          test -f "$receipt_dir/artifacts.json"
          jq -e --arg head "$approved_head" --arg tree "$approved_tree" --arg base "$first_parent" \
            '.state == "READY FOR APPROVAL" and .identity.bound == .identity.observed and .identity.bound.head == $head and .identity.bound.tree == $tree and .identity.bound.base == $base and .external_state.changed == false and .external_state.publication == "NONE" and .credentials == {"exercised":true,"mirror_write_authority":"PROVEN"}' \
            "$receipt" >/dev/null
          candidate_receipt=$(sha256sum "$receipt" | awk '{print $1}')
          candidate_run_id=$(jq -er '.identity.bound.run.id' "$receipt")

          runs=$(gh run list --repo "$REPOSITORY" --workflow crosswake-ci.yml \
            --commit "$approved_head" --status success --limit 20 \
            --json databaseId,headSha,conclusion)
          printf '%s' "$runs" | jq -e --arg head "$approved_head" --argjson run "$candidate_run_id" \
            'any(.[]; .databaseId == $run and .headSha == $head and .conclusion == "success")' >/dev/null
          ci_dir="$RUNNER_TEMP/approved-candidate-ci"
          mkdir -p "$ci_dir"
          gh run download "$candidate_run_id" --repo "$REPOSITORY" \
            --name "phase168-candidate-ci-${approved_head}" --dir "$ci_dir"
          ci_receipt="$ci_dir/release-candidate-ci-receipt.json"
          test -f "$ci_receipt"
          test -f "$ci_dir/artifacts/artifacts.json"
          jq -e --arg head "$approved_head" --arg tree "$approved_tree" \
            --arg base "$first_parent" --arg run "$candidate_run_id" \
            '.state == "PASS" and .head == $head and .tree == $tree and .base == $base and (.run_id | tostring) == $run and .external_state_changed == false' \
            "$ci_receipt" >/dev/null
          ci_receipt_sha=$(sha256sum "$ci_receipt" | awk '{print $1}')
          jq -e --arg digest "$ci_receipt_sha" \
            'any(.identity.bound.proofs[]; .id == "candidate.ci" and .sha256 == $digest)' \
            "$receipt" >/dev/null
          cmp "$receipt_dir/artifacts.json" "$ci_dir/artifacts/artifacts.json"

          # REL-17 is a hard hold on every future publication. This call revalidates
          # the exact post-merge envelope before the workflow exposes release authority.
          REL17_OPERATION="linked_release" \
          REL17_PACKAGE="crosswake" \
          REL17_RECEIPT_DIGEST="$candidate_receipt" \
          REL17_LEG_RUN_ID="$candidate_run_id" \
          REL17_MERGE_OID="$merge_oid" \
          bash script/release_candidate/require_release_evidence.sh

          emit_output "linked_release=true"
          emit_output "approved_head=$approved_head"
          emit_output "approved_tree=$approved_tree"
          emit_output "merge_oid=$merge_oid"
          emit_output "base_oid=$first_parent"
          emit_output "merge_parents=$first_parent,$second_parent"
          emit_output "merge_tree=$merge_tree"
          emit_output "candidate_receipt=$candidate_receipt"
          emit_output "candidate_run_id=$candidate_run_id"
          emit_output "candidate_receipt_run_id=$candidate_receipt_run_id"
          emit_output "approved_version=$manifest_version"

  release-please:
    name: Release Please
    needs: approved-release-guard
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Manifest mode (config-file + manifest-file) emits the PLURAL aggregate
      # `releases_created` — true if ANY package released. Keep it available for
      # summaries, alerts, and logging only; behavioral jobs below gate on exact
      # path/component identity instead of the aggregate.
      releases_created: ${{ steps.release.outputs.releases_created }}
      # JSON array of component paths released by this run. Root/native publish jobs
      # gate on this instead of the aggregate releases_created so a companion-only
      # release cannot publish the core Hex package or native artifacts.
      paths_released: ${{ steps.release.outputs.paths_released || '[]' }}
      # For the root package (path "."), release-please-action v4 writes per-path
      # outputs UNPREFIXED — so `tag_name`/`version` here are the Hex (root) values.
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # Companion: crosswake_rulestead
      # release-please-action v4 path outputs use <path>--<name> (double-dash) format.
      # GitHub Actions if: cannot index slash-containing keys directly; alias here
      # so downstream jobs use dot-notation: needs.release-please.outputs.rulestead_* (D-08).
      rulestead_release_created: ${{ steps.release.outputs['packages/crosswake_rulestead--release_created'] }}
      rulestead_tag_name: ${{ steps.release.outputs['packages/crosswake_rulestead--tag_name'] }}
      rulestead_version: ${{ steps.release.outputs['packages/crosswake_rulestead--version'] }}
      # Companion: crosswake_rindle (Phase 132 — independently versioned, NOT in lockstep)
      # Same double-dash path-output -> dot-notation alias contract as rulestead (D-08):
      # GitHub Actions if: cannot index slash-containing keys, so alias here for downstream.
      rindle_release_created: ${{ steps.release.outputs['packages/crosswake_rindle--release_created'] }}
      rindle_tag_name: ${{ steps.release.outputs['packages/crosswake_rindle--tag_name'] }}
      rindle_version: ${{ steps.release.outputs['packages/crosswake_rindle--version'] }}
      # Companion: crosswake_sigra (Phase 137 — independently versioned, NOT in lockstep)
      # Same double-dash path-output -> dot-notation alias contract (D-08 / D-8):
      # GitHub Actions if: cannot index slash-containing keys, so alias here for downstream.
      sigra_release_created: ${{ steps.release.outputs['packages/crosswake_sigra--release_created'] }}
      sigra_tag_name: ${{ steps.release.outputs['packages/crosswake_sigra--tag_name'] }}
      sigra_version: ${{ steps.release.outputs['packages/crosswake_sigra--version'] }}
      # Companion: crosswake_chimeway (Phase 138 — independently versioned, NOT in lockstep)
      # Same double-dash path-output -> dot-notation alias contract (D-08 / D-8):
      # GitHub Actions if: cannot index slash-containing keys, so alias here for downstream.
      chimeway_release_created: ${{ steps.release.outputs['packages/crosswake_chimeway--release_created'] }}
      chimeway_tag_name: ${{ steps.release.outputs['packages/crosswake_chimeway--tag_name'] }}
      chimeway_version: ${{ steps.release.outputs['packages/crosswake_chimeway--version'] }}
      # Observer: crosswake_threadline (Phase 139 — independently versioned, NOT in lockstep)
      # Same double-dash path-output -> dot-notation alias contract (D-08 / D-8):
      # GitHub Actions if: cannot index slash-containing keys, so alias here for downstream.
      # NOTE: threadline is NOT a Crosswake.Companion implementor — it is a pure-OTP
      # audit/correlation observer. Gate on threadline_release_created (never aggregate releases_created)
      # so a core-only release never publishes threadline (D-8 per-component gate — THREAD-03).
      threadline_release_created: ${{ steps.release.outputs['packages/crosswake_threadline--release_created'] }}
      threadline_tag_name: ${{ steps.release.outputs['packages/crosswake_threadline--tag_name'] }}
      threadline_version: ${{ steps.release.outputs['packages/crosswake_threadline--version'] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4.1.3
        with:
          # Optional: set secret RELEASE_PLEASE_TOKEN (fine-grained PAT) if the
          # default token cannot open Release PRs; otherwise github.token suffices.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-hex:
    name: Publish to Hex.pm
    needs: [approved-release-guard, release-please]
    if: ${{ needs.approved-release-guard.outputs.linked_release == 'true' && needs.release-please.outputs.version == needs.approved-release-guard.outputs.approved_version && contains(fromJSON(needs.release-please.outputs.paths_released), '.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache library deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-library-${{ hashFiles('mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Guarded Hex publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: >
          bash script/guarded_hex_publish.sh
          crosswake
          "${{ needs.release-please.outputs.version }}"
          "${{ needs.release-please.outputs.tag_name }}"
          --approved-head "${{ needs.approved-release-guard.outputs.approved_head }}"
          --approved-tree "${{ needs.approved-release-guard.outputs.approved_tree }}"
          --merge-oid "${{ needs.approved-release-guard.outputs.merge_oid }}"
          --candidate-receipt "${{ needs.approved-release-guard.outputs.candidate_receipt }}"
          --expected-version "${{ needs.approved-release-guard.outputs.approved_version }}"

      # The post-publish record is a WORKFLOW STEP, never a write inside
      # guarded_hex_publish.sh: that helper treats an already-live release as
      # success and returns through more than one path, so a write placed inside
      # it would be reached inconsistently. Here it runs exactly when the publish
      # step returned success.
      #
      # Identical invocation to the recovery lane in hex-publish.yml -- same
      # script, same flags, same order -- differing only in the lane name and in
      # where the values come from. One emitter is what makes "both lanes are
      # satisfied identically" a checkable claim rather than a resemblance.
      - name: Write the publication record
        run: >
          bash script/write_publication_record.sh
          --package "crosswake"
          --version "${{ needs.release-please.outputs.version }}"
          --approved-head "${{ needs.approved-release-guard.outputs.approved_head }}"
          --ref "${{ needs.release-please.outputs.tag_name }}"
          --lane "ordinary"
          --run-id "${{ github.run_id }}"
          --output "${{ runner.temp }}/publication-record.json"

      - name: Upload the publication record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-record-crosswake-${{ needs.approved-release-guard.outputs.approved_head }}
          path: ${{ runner.temp }}/publication-record.json
          if-no-files-found: error
          retention-days: 14

  publish-hex-rulestead:
    name: Publish crosswake_rulestead to Hex.pm
    needs: release-please
    # D-07: Gate on the PER-COMPONENT output, never the aggregate `releases_created`.
    # `releases_created` is true if ANY package released — gating on it would publish the
    # companion on every core-only release. `rulestead_release_created` is set only when
    # release-please cuts a crosswake_rulestead release PR.
    if: ${{ needs.release-please.outputs.rulestead_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # D-13: CROSSWAKE_RELEASE=1 activates the env-conditional crosswake_dep/0 resolver in
    # packages/crosswake_rulestead/mix.exs so every mix step emits the Hex dep (not path:).
    # Without this, mix hex.build (called by hex.publish) errors: "path: deps excluded".
    env:
      CROSSWAKE_RELEASE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # D-09: Checkout the companion tag (not the core tag) so the tarball is built
          # from the exact commit release-please tagged for crosswake_rulestead.
          ref: ${{ needs.release-please.outputs.rulestead_tag_name }}

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache companion deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/crosswake_rulestead/deps
            packages/crosswake_rulestead/_build
          key: ${{ runner.os }}-rulestead-${{ hashFiles('packages/crosswake_rulestead/mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Guarded Hex publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: >
          bash script/guarded_hex_publish.sh
          crosswake_rulestead
          "${{ needs.release-please.outputs.rulestead_version }}"
          "${{ needs.release-please.outputs.rulestead_tag_name }}"

  publish-hex-rindle:
    name: Publish crosswake_rindle to Hex.pm
    needs: release-please
    # D-07: Gate on the PER-COMPONENT output, never the aggregate `releases_created`.
    # `releases_created` is true if ANY package released — gating on it would publish the
    # companion on every core-only release. `rindle_release_created` is set only when
    # release-please cuts a crosswake_rindle release PR.
    if: ${{ needs.release-please.outputs.rindle_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # D-13: CROSSWAKE_RELEASE=1 activates the env-conditional crosswake_dep/0 resolver in
    # packages/crosswake_rindle/mix.exs so every mix step emits the Hex dep (not path:).
    # Without this, mix hex.build (called by hex.publish) errors: "path: deps excluded".
    env:
      CROSSWAKE_RELEASE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # D-09: Checkout the companion tag (not the core tag) so the tarball is built
          # from the exact commit release-please tagged for crosswake_rindle.
          ref: ${{ needs.release-please.outputs.rindle_tag_name }}

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache companion deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/crosswake_rindle/deps
            packages/crosswake_rindle/_build
          key: ${{ runner.os }}-rindle-${{ hashFiles('packages/crosswake_rindle/mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Guarded Hex publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: >
          bash script/guarded_hex_publish.sh
          crosswake_rindle
          "${{ needs.release-please.outputs.rindle_version }}"
          "${{ needs.release-please.outputs.rindle_tag_name }}"

  publish-hex-sigra:
    name: Publish crosswake_sigra to Hex.pm
    needs: release-please
    # D-8 / D-07: Gate on the PER-COMPONENT output, never the aggregate `releases_created`.
    # `releases_created` is true if ANY package released — gating on it would publish the
    # companion on every core-only release. `sigra_release_created` is set only when
    # release-please cuts a crosswake_sigra release PR.
    if: ${{ needs.release-please.outputs.sigra_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # D-13 / T-137-15: CROSSWAKE_RELEASE=1 activates the env-conditional crosswake_dep/0 resolver
    # in packages/crosswake_sigra/mix.exs so every mix step emits the Hex dep (not path:).
    # Without this, mix hex.build (called by hex.publish) errors: "path: deps excluded".
    env:
      CROSSWAKE_RELEASE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # D-09: Checkout the companion tag (not the core tag) so the tarball is built
          # from the exact commit release-please tagged for crosswake_sigra.
          ref: ${{ needs.release-please.outputs.sigra_tag_name }}

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache companion deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/crosswake_sigra/deps
            packages/crosswake_sigra/_build
          key: ${{ runner.os }}-sigra-${{ hashFiles('packages/crosswake_sigra/mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Guarded Hex publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: >
          bash script/guarded_hex_publish.sh
          crosswake_sigra
          "${{ needs.release-please.outputs.sigra_version }}"
          "${{ needs.release-please.outputs.sigra_tag_name }}"

  publish-hex-chimeway:
    name: Publish crosswake_chimeway to Hex.pm
    needs: release-please
    # D-8 / D-07: Gate on the PER-COMPONENT output, never the aggregate `releases_created`.
    # `releases_created` is true if ANY package released — gating on it would publish the
    # companion on every core-only release. `chimeway_release_created` is set only when
    # release-please cuts a crosswake_chimeway release PR.
    if: ${{ needs.release-please.outputs.chimeway_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # D-13 / T-138-12: CROSSWAKE_RELEASE=1 activates the env-conditional crosswake_dep/0 resolver
    # in packages/crosswake_chimeway/mix.exs so every mix step emits the Hex dep (not path:).
    # Without this, mix hex.build (called by hex.publish) errors: "path: deps excluded".
    env:
      CROSSWAKE_RELEASE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # D-09: Checkout the companion tag (not the core tag) so the tarball is built
          # from the exact commit release-please tagged for crosswake_chimeway.
          ref: ${{ needs.release-please.outputs.chimeway_tag_name }}

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache companion deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/crosswake_chimeway/deps
            packages/crosswake_chimeway/_build
          key: ${{ runner.os }}-chimeway-${{ hashFiles('packages/crosswake_chimeway/mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Guarded Hex publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: >
          bash script/guarded_hex_publish.sh
          crosswake_chimeway
          "${{ needs.release-please.outputs.chimeway_version }}"
          "${{ needs.release-please.outputs.chimeway_tag_name }}"

  publish-hex-threadline:
    name: Publish crosswake_threadline to Hex.pm
    needs: release-please
    # D-8 / D-07: Gate on the PER-COMPONENT output, never the aggregate `releases_created`.
    # `releases_created` is true if ANY package released — gating on it would publish the
    # observer on every core-only release. `threadline_release_created` is set only when
    # release-please cuts a crosswake_threadline release PR (THREAD-03).
    if: ${{ needs.release-please.outputs.threadline_release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # D-13 / T-139-12: CROSSWAKE_RELEASE=1 activates the env-conditional crosswake_dep/0 resolver
    # in packages/crosswake_threadline/mix.exs so every mix step emits the Hex dep (not path:).
    # Without this, mix hex.build (called by hex.publish) errors: "path: deps excluded".
    # Also required so the optional :plug and :phoenix_live_view deps resolve correctly.
    env:
      CROSSWAKE_RELEASE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # D-09: Checkout the observer tag (not the core tag) so the tarball is built
          # from the exact commit release-please tagged for crosswake_threadline.
          ref: ${{ needs.release-please.outputs.threadline_tag_name }}

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache observer deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/crosswake_threadline/deps
            packages/crosswake_threadline/_build
          key: ${{ runner.os }}-threadline-${{ hashFiles('packages/crosswake_threadline/mix.lock') }}

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Guarded Hex publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: >
          bash script/guarded_hex_publish.sh
          crosswake_threadline
          "${{ needs.release-please.outputs.threadline_version }}"
          "${{ needs.release-please.outputs.threadline_tag_name }}"

  publish-ios-core:
    name: Mirror iOS core to split repo
    needs: [approved-release-guard, release-please]
    if: ${{ needs.approved-release-guard.outputs.linked_release == 'true' && needs.release-please.outputs.version == needs.approved-release-guard.outputs.approved_version && contains(fromJSON(needs.release-please.outputs.paths_released), 'packages/crosswake-shell-core-ios') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Resolve locked Mix dependencies
        run: mix deps.get --check-locked

      - name: Preflight — assert MIRROR_DEPLOY_KEY is configured
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_DEPLOY_KEY:-}" ]; then
            echo "[crosswake] FAIL: MIRROR_DEPLOY_KEY is not configured."
            echo "[crosswake] What to do next: mint an SSH deploy key with write access on szTheory/crosswake-shell-core-ios and store the private half as the MIRROR_DEPLOY_KEY secret (see script/verify_ios_mirror_backfill.sh's D-05 ritual)."
            exit 1
          fi

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_DEPLOY_KEY }}

      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Publish immutable fast-forward iOS mirror refs
        env:
          CROSSWAKE_IOS_MIRROR_EXECUTE: "true"
        run: >
          bash script/release_candidate/ios_mirror.sh publish
          --version "${{ needs.approved-release-guard.outputs.approved_version }}"
          --ref "${{ needs.approved-release-guard.outputs.merge_oid }}"
          --approval-receipt "${{ needs.approved-release-guard.outputs.candidate_receipt }}"
          --expected-old-ref "$(git ls-remote git@github.com:szTheory/crosswake-shell-core-ios.git refs/heads/main | awk '{print $1}')"
          --expected-new-ref "$(git subtree split --prefix=packages/crosswake-shell-core-ios '${{ needs.approved-release-guard.outputs.merge_oid }}' | tail -1)"

  publish-android-core:
    name: Publish Android core to Maven Central
    needs: [approved-release-guard, release-please]
    if: ${{ needs.approved-release-guard.outputs.linked_release == 'true' && needs.release-please.outputs.version == needs.approved-release-guard.outputs.approved_version && contains(fromJSON(needs.release-please.outputs.paths_released), 'packages/crosswake-shell-core-android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download and validate the approved candidate receipt
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_HEAD: ${{ needs.approved-release-guard.outputs.approved_head }}
          APPROVED_TREE: ${{ needs.approved-release-guard.outputs.approved_tree }}
          APPROVED_BASE: ${{ needs.approved-release-guard.outputs.base_oid }}
          APPROVED_VERSION: ${{ needs.approved-release-guard.outputs.approved_version }}
          APPROVED_RECEIPT: ${{ needs.approved-release-guard.outputs.candidate_receipt }}
          RECEIPT_RUN_ID: ${{ needs.approved-release-guard.outputs.candidate_receipt_run_id }}
        run: |
          set -euo pipefail
          artifact_name="phase168-candidate-receipt-${APPROVED_HEAD}"
          receipt_dir="$RUNNER_TEMP/approved-candidate-receipt"
          mkdir -p "$receipt_dir"
          artifact_index=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECEIPT_RUN_ID/artifacts?per_page=100")
          [ "$(printf '%s' "$artifact_index" | jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length')" -eq 1 ]
          gh run download "$RECEIPT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" --dir "$receipt_dir"
          actual_files=$(find "$receipt_dir" -type f -printf '%P\n' | LC_ALL=C sort)
          [ "$actual_files" = $'artifacts.json\ncandidate-receipt.json' ]
          receipt="$receipt_dir/candidate-receipt.json"
          receipt_digest=$(sha256sum "$receipt" | awk '{print $1}')
          [ "$receipt_digest" = "$APPROVED_RECEIPT" ]
          jq -e --arg head "$APPROVED_HEAD" --arg tree "$APPROVED_TREE" \
            --arg base "$APPROVED_BASE" --arg version "$APPROVED_VERSION" \
            '.state == "READY FOR APPROVAL" and
             .identity.bound == .identity.observed and
             .identity.bound.ref == $head and .identity.bound.head == $head and
             .identity.bound.tree == $tree and .identity.bound.base == $base and
             .identity.bound.version == $version and
             .external_state.publication == "NONE" and .external_state.changed == false' \
            "$receipt" >/dev/null

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        run: >
          bash script/release_candidate/android_publication.sh
          --version "${{ needs.approved-release-guard.outputs.approved_version }}"
          --ref "${{ needs.approved-release-guard.outputs.merge_oid }}"
          --approved-head "${{ needs.approved-release-guard.outputs.approved_head }}"
          --approved-tree "${{ needs.approved-release-guard.outputs.approved_tree }}"
          --candidate-receipt "${{ needs.approved-release-guard.outputs.candidate_receipt }}"
          --receipt-file "$RUNNER_TEMP/approved-candidate-receipt/candidate-receipt.json"
          --execute

  clean-room-proof-ios:
    name: Clean-room proof — iOS swift build
    needs: [release-please, publish-hex, publish-ios-core]
    if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), 'packages/crosswake-shell-core-ios') }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install crosswake archive at just-cut version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: mix archive.install hex crosswake "$VERSION" --force

      - name: Generate iOS shell outside monorepo
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/clean-room-proof-ios"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          mix crosswake.gen.shell ios --target "$TARGET"

      - name: swift build with mirror tag retry
        run: |
          set -euo pipefail
          PROJECT_ROOT="$RUNNER_TEMP/clean-room-proof-ios/native/ios/crosswake_shell"
          cd "$PROJECT_ROOT"

          for i in 1 2 3; do
            if swift build; then
              echo "swift build succeeded on attempt $i"
              exit 0
            fi

            echo "swift build attempt $i/3 failed; retrying in 30s for mirror tag availability..."
            sleep 30
          done

          echo "swift build failed after 3 attempts."
          exit 1

  clean-room-proof-android:
    name: Clean-room proof — Android gradle build
    needs: [release-please, publish-hex, publish-android-core]
    if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), 'packages/crosswake-shell-core-android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Hex + Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install crosswake archive at just-cut version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: mix archive.install hex crosswake "$VERSION" --force

      - name: Generate Android shell outside monorepo
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/clean-room-proof-android"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          mix crosswake.gen.shell android --target "$TARGET"

      - name: gradle build with Maven Central propagation polling
        run: |
          set -euo pipefail
          PROJECT_ROOT="$RUNNER_TEMP/clean-room-proof-android/native/android/crosswake_shell"
          cd "$PROJECT_ROOT"
          chmod +x gradlew

          MAX_ATTEMPTS=40
          DELAY=45
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            if ./gradlew build --no-daemon; then
              echo "gradle build succeeded on attempt $i"
              exit 0
            fi

            echo "Attempt $i/$MAX_ATTEMPTS: gradle build failed; Maven Central may not have propagated. Retrying in ${DELAY}s..."
            sleep "$DELAY"
          done

          echo "gradle build failed after $MAX_ATTEMPTS attempts (~30 min). Maven Central propagation timeout."
          exit 1

  exact-public-proof:
    name: "release: exact-public artifact proof"
    needs:
      - approved-release-guard
      - release-please
      - publish-hex
      - publish-ios-core
      - publish-android-core
      - clean-room-proof-ios
      - clean-room-proof-android
    if: ${{ needs.approved-release-guard.outputs.linked_release == 'true' && needs.release-please.outputs.version == needs.approved-release-guard.outputs.approved_version }}
    # LOAD-BEARING, NOT COSMETIC. This workflow declares a top-level
    # `permissions:` key, so every scope it does not list -- `actions` among them
    # -- is `none` at workflow level; `actions: read` exists only as a job-level
    # grant here and on approved-release-guard. A called workflow's own
    # `permissions:` can only NARROW the token this job hands it, never widen it,
    # so declaring `actions: read` inside exact-public-proof.yml does not grant
    # it. Drop this block and both the candidate-receipt download and the
    # publication-record download fail with a forbidden response -- at release
    # time, on a real release. actionlint cannot catch that (T-173-15).
    #
    # `contents: write` / `pull-requests: write` are here for the called
    # workflow's `record-ledger` job ONLY (XPUB-06): it commits the proof verdict
    # to docs/release-ledger/RELEASE-LEDGER.jsonl on a run-scoped branch and opens
    # a pull request, because main is protected. The grant cannot reach the proof
    # body: that job declares its own `actions: read` / `contents: read` block,
    # which narrows this token back down. Drop these two scopes and the ledger job
    # fails its push at release time -- visibly, in the job summary, but the verdict
    # never lands in git.
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/exact-public-proof.yml
    with:
      package: crosswake
      version: ${{ needs.release-please.outputs.version }}
      approved_head: ${{ needs.approved-release-guard.outputs.approved_head }}
      merge_oid: ${{ needs.approved-release-guard.outputs.merge_oid }}
      candidate_receipt_run_id: ${{ needs.approved-release-guard.outputs.candidate_receipt_run_id }}
      lane: ordinary

  linked-release-rollup:
    name: "release: linked release rollup"
    needs:
      - approved-release-guard
      - release-please
      - publish-hex
      - publish-ios-core
      - publish-android-core
      - clean-room-proof-ios
      - clean-room-proof-android
      - exact-public-proof
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Initialize linked release rollup
        id: linked-release
        env:
          LINKED_RELEASE: ${{ needs.approved-release-guard.outputs.linked_release }}
        run: |
          set -euo pipefail
          if [ "$LINKED_RELEASE" = "true" ]; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo '{"state":"NOT_APPLICABLE","child_states":{},"successful_coordinates":[],"failed_step":null,"failed_ref":null,"next_action":"no_action_required"}' > linked-release-status.json
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: ${{ steps.linked-release.outputs.applicable == 'true' }}
        with:
          ref: ${{ needs.approved-release-guard.outputs.merge_oid }}
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        if: ${{ steps.linked-release.outputs.applicable == 'true' }}
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Resolve locked Mix dependencies
        if: ${{ steps.linked-release.outputs.applicable == 'true' }}
        run: mix deps.get --check-locked
      - name: Preserve exact linked child states
        # The executable policy emits COMPLETE only for all six successes and
        # PARTIAL whenever an immutable public coordinate survives a failure.
        if: ${{ steps.linked-release.outputs.applicable == 'true' }}
        env:
          APPROVED_HEAD: ${{ needs.approved-release-guard.outputs.approved_head }}
          APPROVED_TREE: ${{ needs.approved-release-guard.outputs.approved_tree }}
          APPROVED_REF: ${{ needs.approved-release-guard.outputs.merge_oid }}
          APPROVED_VERSION: ${{ needs.approved-release-guard.outputs.approved_version }}
          CANDIDATE_RECEIPT: ${{ needs.approved-release-guard.outputs.candidate_receipt }}
          HEX_STATE: ${{ needs.publish-hex.result }}
          IOS_STATE: ${{ needs.publish-ios-core.result }}
          ANDROID_STATE: ${{ needs.publish-android-core.result }}
          IOS_PROOF_STATE: ${{ needs.clean-room-proof-ios.result }}
          ANDROID_PROOF_STATE: ${{ needs.clean-room-proof-android.result }}
          EXACT_PUBLIC_STATE: ${{ needs.exact-public-proof.result }}
          LINKED_RELEASE_STATUS: linked-release-status.json
        run: |
          set -euo pipefail
          mix run --no-start -e 'Crosswake.ReleaseCandidate.Workflow.evaluate_cli!()'
      - name: Upload linked release status
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linked-release-status
          path: linked-release-status.json
          if-no-files-found: error
          retention-days: 30

  native-release-rollup:
    name: Native release status rollup
    needs:
      - approved-release-guard
      - release-please
      - publish-ios-core
      - clean-room-proof-ios
      - publish-android-core
      - clean-room-proof-android
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Build native release status
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released || '[]' }}
          LINKED_RELEASE: ${{ needs.approved-release-guard.outputs.linked_release }}
          IOS_PUBLISH_RESULT: ${{ needs.publish-ios-core.result }}
          IOS_PROOF_RESULT: ${{ needs.clean-room-proof-ios.result }}
          ANDROID_PUBLISH_RESULT: ${{ needs.publish-android-core.result }}
          ANDROID_PROOF_RESULT: ${{ needs.clean-room-proof-android.result }}
        run: |
          set -euo pipefail

          released_path() {
            if [ "$LINKED_RELEASE" != "true" ]; then
              printf "false"
              return
            fi

            case "$PATHS_RELEASED" in
              *"$1"*) printf "true" ;;
              *) printf "false" ;;
            esac
          }

          platform_state() {
            released="$1"
            publish_result="$2"
            proof_result="$3"

            if [ "$released" != "true" ]; then
              printf "skipped"
            elif [ "$publish_result" != "success" ]; then
              printf "failed"
            elif [ "$proof_result" = "success" ]; then
              printf "proven"
            elif [ "$proof_result" = "skipped" ]; then
              printf "published"
            else
              printf "failed"
            fi
          }

          ios_released="$(released_path "packages/crosswake-shell-core-ios")"
          android_released="$(released_path "packages/crosswake-shell-core-android")"
          ios_state="$(platform_state "$ios_released" "$IOS_PUBLISH_RESULT" "$IOS_PROOF_RESULT")"
          android_state="$(platform_state "$android_released" "$ANDROID_PUBLISH_RESULT" "$ANDROID_PROOF_RESULT")"

          if [ "$ios_released" != "true" ] && [ "$android_released" != "true" ]; then
            native_core="none"
          elif [ "$ios_state" = "proven" ] && [ "$android_state" = "proven" ]; then
            native_core="complete"
          else
            native_core="partial"
          fi

          if [ "$native_core" = "complete" ]; then
            next_action="No native recovery action needed."
          elif [ "$ios_released" = "true" ] && [ "$ios_state" != "proven" ]; then
            next_action="Fix MIRROR_DEPLOY_KEY or run the iOS mirror backfill workflow."
          elif [ "$android_released" = "true" ] && [ "$android_state" != "proven" ]; then
            next_action="Inspect Android Maven publish/proof before declaring native complete."
          else
            next_action="Review native release paths before declaring native complete."
          fi

          cat > native-release-status.json <<JSON
          {
            "version": "${VERSION}",
            "native_core": "${native_core}",
            "ios": {
              "released": ${ios_released},
              "publish": "${IOS_PUBLISH_RESULT}",
              "proof": "${IOS_PROOF_RESULT}",
              "state": "${ios_state}"
            },
            "android": {
              "released": ${android_released},
              "publish": "${ANDROID_PUBLISH_RESULT}",
              "proof": "${ANDROID_PROOF_RESULT}",
              "state": "${android_state}"
            },
            "next_action": "${next_action}"
          }
          JSON

          {
            echo "## Native release status"
            echo ""
            echo "- Version: ${VERSION:-unknown}"
            echo "- native_core=${native_core}"
            echo "- iOS: released=${ios_released}, publish=${IOS_PUBLISH_RESULT}, proof=${IOS_PROOF_RESULT}, state=${ios_state}"
            echo "- Android: released=${android_released}, publish=${ANDROID_PUBLISH_RESULT}, proof=${ANDROID_PROOF_RESULT}, state=${android_state}"
            echo "- Next action: ${next_action}"
          } >> "$GITHUB_STEP_SUMMARY"

          # D-17: a partial native release must not claim success. native_core=none (no
          # native package released this run — the normal companion-only path) stays
          # exit 0; native_core=partial with at least one native platform released must
          # fail closed, now that the artifact and step summary above already captured
          # the diagnostic this exit is about to fail on.
          if [ "$native_core" != "complete" ] && { [ "$ios_released" = "true" ] || [ "$android_released" = "true" ]; }; then
            echo "[crosswake] FAIL: native release is partial (native_core=${native_core}) — ${next_action}"
            exit 1
          fi

      - name: Upload native release status
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: native-release-status
          path: native-release-status.json
          if-no-files-found: error
          retention-days: 14

  # On-demand lockstep consistency assertion: confirms the three configured version coordinates
  # (mix.exs @version, build.gradle.kts version, .release-please-manifest.json) are internally
  # consistent. This is the D-05 110-equivalent of SC#4 — proves the lockstep CONFIG is correct
  # without requiring a live 0.1.2 artifact (that happens at Phase 111's real cut).
  lockstep-truth:
    name: Assert lockstep version coordinates match
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Assert lockstep version coordinates match
        run: |
          set -euo pipefail

          # The marker deliberately precedes @version on the next line. Extract that
          # following declaration and reject absence before comparing coordinates.
          MIX_VERSION=$(sed -n '/# x-release-please-version/{n;s/^[[:space:]]*@version "\([^\"]*\)".*/\1/p;}' mix.exs)

          # Extract build.gradle.kts version (x-release-please-version annotation)
          GRADLE_VERSION=$(grep '// x-release-please-version' packages/crosswake-shell-core-android/build.gradle.kts \
            | sed 's/.*version = "\(.*\)" \/\/.*/\1/')

          # Extract manifest baselines (. and packages/crosswake-shell-core-android)
          MANIFEST_ROOT=$(python3 -c "import json; d=json.load(open('.release-please-manifest.json')); print(d['.'])")
          MANIFEST_ANDROID=$(python3 -c "import json; d=json.load(open('.release-please-manifest.json')); print(d['packages/crosswake-shell-core-android'])")

          if [ -z "$MIX_VERSION" ] || [ -z "$GRADLE_VERSION" ] || \
             [ -z "$MANIFEST_ROOT" ] || [ -z "$MANIFEST_ANDROID" ]; then
            echo "LOCKSTEP EXTRACTION FAILED: one or more configured version coordinates are empty."
            exit 1
          fi

          echo "mix.exs @version:               $MIX_VERSION"
          echo "build.gradle.kts version:       $GRADLE_VERSION"
          echo "manifest . baseline:            $MANIFEST_ROOT"
          echo "manifest android baseline:      $MANIFEST_ANDROID"

          # All four must be equal for internal lockstep consistency
          if [ "$MIX_VERSION" != "$GRADLE_VERSION" ] || \
             [ "$MIX_VERSION" != "$MANIFEST_ROOT" ] || \
             [ "$MIX_VERSION" != "$MANIFEST_ANDROID" ]; then
            echo "LOCKSTEP MISMATCH:"
            echo "  mix.exs @version:             $MIX_VERSION"
            echo "  build.gradle.kts version:     $GRADLE_VERSION"
            echo "  manifest . baseline:          $MANIFEST_ROOT"
            echo "  manifest android baseline:    $MANIFEST_ANDROID"
            exit 1
          fi

